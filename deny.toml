# cargo-deny license policy for the Rust crates the release ships (rs-plugkit, agentplug).
# Run from the repo root: cargo deny --manifest-path <crate>/Cargo.toml check licenses
[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BlueOak-1.0.0",
  "MPL-2.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

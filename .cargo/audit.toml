# cargo-audit configuration read by the doc-drift cargo-audit job (run from the repo root).

[advisories]
ignore = [
    # RUSTSEC-2026-0381 (webpki-roots bundled roots trust distrusted emSign intermediates).
    # No webpki-roots 0.26.x release is patched (0.26.12 does not exist in the index), and the
    # 0.26 line is pinned by ureq 2 and agentplug-host. In agentplug/Cargo.lock the 0.26.11
    # entry now depends on webpki-roots 1.0.10 (the fixed 1.x line), so the data in the build is
    # the patched roots. The remaining 0.26.11 match is a version-only match on the shim.
    "RUSTSEC-2026-0381",
]

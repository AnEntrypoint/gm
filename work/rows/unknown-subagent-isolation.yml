body: "The owner asked for this to be fixed as far as possible (2026-11-02). The single worker's limit was measured in query_log paging, and fixed (DESIGN.md, Single-worker limit). The handoff mechanics are built and witnessed by a scripted parent and child: next_context returns the child's run id, and the parent reads the child's witness through the CLI (DESIGN.md, Subagent handoff). Whether isolation helps a long-horizon outcome is not measured: it needs a live model run, which gm does not make, so it is reported to gm. The row stays blocked on that measurement."

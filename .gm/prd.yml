- id: STABLEPREFIX-INSTRUCTION-PAYLOAD-ORDER
  title: 'Instruction payload: serve the instruction text before volatile fields'
  subject: rs-plugkit instructions payload
  description: 'In rs-plugkit/crates/plugkit-core/src/orchestrator/instructions/mod.rs handle_instruction, the served JSON is a serde_json json! map. serde_json has no preserve_order feature in rs-plugkit, so keys serialize alphabetically. Witnessed on the live out-file instruction-lean-entry-1-*.json (32455 bytes): the instruction key starts at byte 4721, after codeinsight_start (1304), codeinsight_overview (29), config_changed (1935) and dream_rsi_replay/strategy (4442/4466); mutables_pending, prd_items, recall_hits and route_hint follow it at bytes 29897-31616. The stable instruction prose (entry + phase prose, ~3.9 KB) therefore sits behind about 4.7 KB of volatile telemetry, and the bytes after it are volatile too, so the prose is never at a stable offset. Fix: emit instruction and instruction_hash as the leading members of the served object, keeping every other field unchanged. Choose between enabling serde_json preserve_order for plugkit-core (rehashes payloads once: last-instruction-hash markers and asserted hashes change) and splicing the leading members ahead of the existing map serialization (no hash change).'
  witness_plan: Rebuild rs-plugkit wasm with --features slim, sideload per AGENTS.md, dispatch instruction through agentplug-runner, read the new out-file and assert the byte offset of the instruction key is below 200 and the payload parses to the same field set as before.

- id: JTBD-RESUME-INTERRUPTED-WALK
  title: 'Job: an interrupted walk resumes in a new session from disk state without re-deciding closed rows'
  obligation_kind: discovery
  body: 'Hired when: a session ends or crashes mid-walk and a later session must continue the same walk. Job: the new session reads .gm/prd.yml, .gm/mutables.yml and the phase state, and continues from the first open row, without re-opening rows already closed or re-asking resolved mutables. Not stated anywhere in README, AGENTS.md or SKILL.md: the stop hook blocks session end on open rows (README ''How it works'', Gates), and gm-continue is named as the post-COMPLETE handoff only, so resumption after an interrupted, non-COMPLETE walk has no stated path. Done when a live witness interrupts a walk with one open row and one closed row, starts a fresh session, and shows the next dispatch targets only the open row.'
  session_id: lean-hop-JTBD
  status: pending
- id: JTBD-FRESH-CLONE-RECALL
  title: 'Job: a fresh clone recalls the project''s recorded decisions on first use'
  obligation_kind: discovery
  body: 'Hired when: a new contributor or machine clones a repository that has .gm/memories/*.md but no gm.db. Job: the first recall returns the project''s recorded decisions. README ''Memory'' says gm.db is a derived, untracked cache and the first recall triggers one full-corpus sync, so the first call pays the whole cost with no stated bound and no progress signal. Not stated anywhere as a job: no row measures first-recall latency on a fresh clone. Done when a live witness on a fresh clone with no gm.db records first-recall latency, hit count against the recorded memories, and the second recall latency, and the first-call cost is either bounded or surfaced in the response.'
  session_id: lean-hop-JTBD
  status: pending
- id: JTBD-BACKOUT-WRONG-CHANGE
  title: 'Job: back out a wrong change with a recorded reason, keeping PRD and mutable state consistent'
  obligation_kind: discovery
  body: 'Hired when: a walk has committed or transitioned into a wrong change and the user must undo it. Job: revert the change and record why, without leaving PRD rows marked closed for work that no longer exists or mutables resolved against a reverted witness. The verbs exist (transition-revert, git_reset_head refusing pushed commits) but no stated path links a revert to the PRD and mutable rows it invalidates; AGENTS.md covers only git_reset_head and the dedup repair. Done when a live witness closes a row, reverts the transition that closed it, and shows the row reopened or flagged and the revert reason recorded in the evidence.'
  session_id: lean-hop-JTBD
  status: pending

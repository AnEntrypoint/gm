- detail: 'Root cause (verified live, not the shell-out hypothesis): walk_posix in rs-plugkit/crates/plugkit-core/src/code_index.rs is a pure in-process walk over host_fs_readdir. On C:\dev\aloopprime, fs_readdir {"path":"."} lists an entry named `nul`, but fs_stat {"path":"./nul"} returns not-found, because nul is a reserved DOS device name Win32 will not open in any directory. With checked == true walk_posix did `return Err("file stat failed for {next}")`, propagating as file_enumeration_failed / complete:false / enumeration_complete:false -- so one unstattable entry costs the whole project its index and every codeinsight call answers ''symbol index refresh is incomplete'' forever. FIX IS WRITTEN BUT NOT LANDED: committed as rs-plugkit 8395d5ebadd008c2c29810024e5a80d7f60248ab (one path, crates/plugkit-core/src/code_index.rs) -- unstattable entries are now skipped and recorded (FileEnumeration::skipped_unstattable surfaced by codeinsight_index) instead of fatal, and Windows reserved device names (con/prn/aux/nul/com1..com9/lpt1..lpt9, case-insensitive, with or without extension, plus trailing-dot/space) are pre-filtered only when the host cwd is Windows-shaped so a POSIX aux.rs still indexes. Compile-verified: cargo build -p rs-plugkit --release --target wasm32-wasip1 --features slim exit 0 (5,656,887-byte wasm). NOT DONE: the wasm was never installed to ~/.agentplug/plugins/gm.wasm, so no live codeinsight verification ran -- reconfirmed 2026-10-10 that C:\dev\aloopprime codeinsight_index {"action":"status"} still returns complete:false / ''file stat failed for ./nul''. PUSH BLOCKED, DO NOT FORCE: rs-plugkit main is not a fast-forward of origin/main and another writer has crates/plugkit-core/src/config_sync.rs dirty with 5082 staged deletions under .agentplug-kv/codeinsight-edges/ -- pulling over that clobbers in-flight work. Landing sequence: wait for that writer, pull, push, rebuild+install gm.wasm, then re-run codeinsight_index sync and codeinsight callers on aloopprime.'

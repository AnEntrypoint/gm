- id: JTBD-REVIEWER-ONEPASS
  title: 'Job: a human reviewer accepts an agent diff in one pass'
  body: 'Hired when: a maintainer must decide whether an agent-authored change is safe to merge. Job: let the reviewer accept or reject the change from the diff, the gate results and the recorded reason, without re-deriving the agent''s reasoning. Not stated anywhere in README, AGENTS.md or SKILL.md: those describe gates for the agent, never the reviewer''s read. Done when a reviewer-facing summary (net line delta, gates passed, witnesses, PRD rows closed) is reachable through one verb and cites only recorded evidence.'
  obligation_kind: discovery
  session_id: lean-node-JTBD
  status: pending
- id: JTBD-INDEPENDENT-PROOF
  title: 'Job: a third party verifies the walk without trusting the agent'
  body: 'Hired when: a team or auditor must rely on a gm walk''s COMPLETE result. Job: prove that verification happened from evidence the agent did not write. README states three gate checks (ci-validated-fresh, app-loads-witnessed, claim-audit-clean) read marker files the agent itself writes and that these depend on honest reporting. No stated job covers an independently checkable proof. Done when a COMPLETE walk can be re-checked by a party holding only the repository and its recorded witnesses, with no marker the agent authored being load-bearing.'
  obligation_kind: discovery
  session_id: lean-node-JTBD
  status: pending
- id: JTBD-CREDENTIAL-KEEPOUT
  title: 'Job: keep credentials out of pushed history'
  body: 'Hired when: an agent is about to commit or push a change that could contain a secret. Job: stop a credential from reaching remote history. gm states this only as the diff-scoped predicate no-secrets-in-diff, whose own docs say it is heuristic and no substitute for a dedicated scanner. No README, AGENTS.md or SKILL.md text names the job, its scope (history, not only the working diff), or what must happen when the heuristic misses. Done when the job''s boundary is stated, and a witness shows a seeded credential shape blocked before push.'
  obligation_kind: discovery
  session_id: lean-node-JTBD
  status: pending
- id: JTBD-SPEND-VISIBILITY
  title: 'Job: see what a walk cost in tokens and dispatches'
  body: 'Hired when: a developer or team is deciding whether a gm walk was worth its cost. Job: report the token and dispatch spend of a walk, grouped by phase and by rework, so the cost of iteration is visible. AGENTS.md and the rework prose describe the principle that rework dominates token spend, but no stated job gives the user a measurement of their own spend. Dream-RSI observations record verb, exit code, fingerprint, quality and timestamp only, with no cost field. Done when one verb reports per-walk spend split by phase and by re-entered phase, read from recorded dispatches.'
  obligation_kind: discovery
  session_id: lean-node-JTBD
  status: pending

body: 'SPECIFY: row PLUGKIT-SEMVER-UPDATE-WITNESS (pending, lean-node-INVEST) requires a live daemon to replace a sideloaded stale gm.wasm and report loaded_plugin_content_sha256.gm equal to the release wasm. Prior blocker PLUGKIT-SEMVER-UPDATE-WITNESS-blocker-gm-prdall-20261014-04-k03 records witness FAIL at live probe 1791956486500-500-ce00a73be888be7e (daemon sha c5e088f3..., expected db42b8dc..., gm.build.json 0.1.1634). Static root cause: agentplug/crates/agentplug-runner/src/download.rs ensure_plugin_installed_via_github (line 2139) returns early on dest.exists() with matching version before the sha256 sidecar is fetched, so refresh_plugin_if_stale Equal-version sha drift never downloads. PROVE: the fix row PLUGKIT-SEMVER-SHA-DRIFT-FIX is still pending (not landed). Local cargo builds are blocked by a hook; rs-plugkit/agentplug wasm and runner changes are verified by CI release only (gm-no-local-cargo-verified-by-ci). A probe cannot separate the leader from the alternative without a rebuilt runner and a sideload in a session other than the writer''s, so no witness binds this row in session gm-drain-w1-237. Blocked stage: PROVE. Unblock: land PLUGKIT-SEMVER-SHA-DRIFT-FIX, release agentplug-runner and plugkit wasm, then rerun the sideload witness from another session. Receipts: .gm/receipts/PLUGKIT-SEMVER-UPDATE-WITNESS-blocker-gm-prdall-20261014-04-k03/ (prior run).'

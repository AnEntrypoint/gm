subject: 'SLAP-GMMCP-DISPATCHCOMMAND-ARGV blocked: cli.js refactor cannot land while gm-mcp src and bin carry sibling WIP'
body: 'Blocks row SLAP-GMMCP-DISPATCHCOMMAND-ARGV. The refactor of dispatchCommand (gm-mcp/src/cli.js) is verified in isolation (witness dispatch 1791891212586-500-cde62be2d9cee31b, HEAD src plus the new cli.js, raw exec_js echo exit 0; usage-error text identical to HEAD). It is not committed: the patch is saved at .gm/receipts/SLAP-GMMCP-DISPATCHCOMMAND-ARGV/cli-dispatch-argv.patch and src/cli.js is back at HEAD. Reason: bin/gm-mcp-server.js is a generated bundle of src/, and the gm-mcp working tree holds uncommitted sibling edits (src/dispatch.js, src/http-transport.js, src/index.js, src/release-bridge.js) from SLAP-GMMCP-STARTHTTP-ROUTING and SLAP-GMMCP-RUNDISPATCH-LEVELS, so any in-tree bundle would publish their WIP. Unblock: after those rows commit their gm-mcp src and bin, apply the patch, run node scripts/build.mjs in gm-mcp, confirm node scripts/check-bin-drift.mjs exits 0, and commit src/cli.js with bin/gm-mcp-server.js in one gm-mcp commit. Also observed, pre-existing and unrelated: on Windows every dispatch that exits through process.exit after ensureHttpSingleton ends with exit status 3221226505 (libuv assertion UV_HANDLE_CLOSING in src/win/async.c), seen 3 of 3 on HEAD bundle. Separately, the gm-mcp npm test script fails at HEAD working tree on an import of compareVersions from self-update.js in the sibling WIP state (test/runner-recovery.test.mjs).'

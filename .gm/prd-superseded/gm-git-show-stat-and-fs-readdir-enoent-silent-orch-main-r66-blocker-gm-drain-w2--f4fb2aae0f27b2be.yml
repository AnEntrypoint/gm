body: 'Row gm-git-show-stat-and-fs-readdir-enoent-silent-orch-main-r66 stays pending. PROVE: live git_show {rev:HEAD, stat:true} (dispatch 1791961629546-500-652c3622a8ad936b) returns the stat block, so the git_show half is already satisfied on the deployed guest. fs_readdir on a missing path still answers error:''empty'', next_dispatch_hint:''instruction'' (dispatch 1791961624570-500-878764607b1a5a64), so the fs_readdir half is open. EMIT: committed 0eea5993 on rs-plugkit local main (crates/plugkit-core/src/wasm_dispatch/verbs.rs fs_readdir null branch now err_json naming path, error_code ENOENT, next_dispatch_hint fs_stat). git_finalize push refused as remote_moved (dispatch 1791961732092-500-4ff4f0e96fa4b86d): incoming range 4be7a93..2f6bc4cb also changes verbs.rs. git_pull main refused (dispatch 1791961750876-500-7f9edbe89c1839c6) because another lane''s uncommitted crates/plugkit-core/src/wasm_dispatch/verbs/search.rs would be overwritten. Recovery needs the owning lane to commit or stash search.rs (and Cargo.toml) first, then git_pull main, reconcile verbs.rs, git_push rev HEAD, then cargo CI and a live fs_readdir witness on the rebuilt guest.'

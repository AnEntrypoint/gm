subject: A poisoned plugin slot reloads without failing the next dispatch (w577 clause 1)
text: 'Acceptance: a plugin slot that dies poisoned (a plugin that panicked, aborted or returned an unloadable state) is reloaded on the next dispatch, and that reload does not fail the dispatch that triggered it. Locate the real edit site and make the change; the row is closed on a live witness, not on a diff.'

  Codesearch of `requestNumber` in gm-mcp/test and gm-mcp/scripts returns 0 matches (dispatches 1791971556081-500-4d70cd8f13c15b12, 1791971578208-500-6df023a130aaba7c); no test references the alias. The alias exists only in the working-tree diff of gm-mcp/src/dispatch.js (`const requestNumber = sequence`, renamed from `n`), mixed with foreign-writer hunks (imports from ./spool-store.js, which is untracked; staged src/self-update.js; untracked src/spool-store.js).
  Delivery is blocked: publishing src/dispatch.js alone would import an untracked module and carry foreign hunks. A requestNumber-only commit has no failing test to witness.
  Next (for a new row, not this one): decide whether the working-tree dispatch.js refactor is wanted at all. If the RED signal is an archive-without-node_modules artifact, fix the scratch-archive recipe in gm-mcp/AGENTS.md or the witness, not dispatch.js. Mutable to record: which test the gm-mcp RED claim came from, if any.

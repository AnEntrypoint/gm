body: 'Row THINSLICE-NATIVE-SEARCH-GATE asserts a deviation gate that refuses native Grep/Glob/find/rg/Explore for content search, with witness = a live native Grep refused by that gate. SPECIFY (receipts/THINSLICE-NATIVE-SEARCH-GATE/01-SPECIFY.md) found no such gate: no `G_CONTRACT-native-search-ban-restated` text and no `deviation.native-search` emitter in gm-config/fsm/predicates.md or the rs-plugkit orchestrator (exhaustive zero scans, dispatches 1791966657468-500-f9af076cd5670d7e, 1791966748540-500-b7945615eb2bc4e7, 1791966817282-500-112aa51a713b014c). Native Grep/Glob are harness tools outside the gm dispatch port, so no gm gate can refuse them. Resolution needs a scoped decision: (a) add a predicate to gm-config/fsm/predicates.md plus a rs-plugkit emitter and CI rebuild, with the refusal scoped to gm dispatches only; or (b) restate the ban in prose only and drop the gate claim from the row. Witness for either: the prose grep for the ban sentence returns no match, and for (a) a gm-dispatched Grep refused by the named gate. Row THINSLICE-NATIVE-SEARCH-GATE stays pending until one is chosen.'

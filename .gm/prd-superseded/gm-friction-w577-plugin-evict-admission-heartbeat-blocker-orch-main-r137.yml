text: |-
  Blocked, not skipped. Two independent blockers, each witnessed live.

  BLOCKER 1 -- the row id is already taken and completed by another session. prd-list {id:gm-friction-w577-plugin-evict-admission-heartbeat} (dispatch 1791668473145-500-837e919c3e5fe4be) returns status=completed, kind=blocker, session_id=orch-main-r77, title 'plugin evict must not drop a live admission heartbeat claim', witness 'selfcheck-idle-evict exit=0 RESULT: PASS ... Code pushed as agentplug 66ba9ab3 (on origin/main via 3d41723)'. That completed subject covers NONE of the three served clauses: (1) poisoned plugin slot reloads without failing the next dispatch -- r77 worked evict-vs-live-claim, not reload-after-poison; (2) admission starvation returns a retry hint for read-only dispatches -- untouched; (3) three-line heartbeat format documented and enforced by pool-brief -- untouched (codesearch literal 'heartbeat' over ./skills, dispatch 1791668540978-500-e6d963552f362d2f, exhaustive=true, returns no three-line format anywhere). Landing the three clauses under this id would overwrite r77's subject and witness, which gm-prd forbids ('prd-add on an existing id overwrites its subject'; 'Never reuse the row's own id for a blocker: that rescopes the row'). The three clauses need a FRESH row id minted by the orchestrator.

  BLOCKER 2 -- every edit site for the three clauses is dirty with no .gm/pool/*.live claim. git_status {paths:[agentplug, rs-plugkit, skills/gm-orchestrate/SKILL.md, skills/gm-prd/SKILL.md, skills/gm/docs/verbs.md]} (dispatch 1791668624515-500-5b728fece9c0ac8b) at head c28312493ec1be24617314062a6c1bd948eb0491 lists modified: agentplug, skills/gm-orchestrate/SKILL.md, skills/gm/docs/verbs.md. git_diff over those paths (dispatch 1791668670765-500-2b894e8754d02d69) shows verbatim: 'diff --git a/agentplug ... -Subproject commit c7e03e8c70b76a017a4914e86a2eabf866821a9e / +Subproject commit 0beb855b3a2ef3aead5ed0f5bb76dd9f83485cd3-dirty' and a real content diff in skills/gm-orchestrate/SKILL.md. The agentplug submodule is dirty at its content, so clause 1's sites (agentplug/crates/agentplug-host/src/registry.rs:1370,1378,1476 and agentplug/crates/agentplug-runner/src/daemon.rs:2284 -- confirmed by codesearch literal 'last_active', dispatch 1791668623343-500-c36460db7471f09, exhaustive=true) cannot be edited without sweeping another lane's in-flight work. No .gm/pool/*.live file names agentplug or either skill file: the ten live lanes claim other rows (exec_js dispatch 1791668585382-500-2647a008ef5ba4cf read the whole pool dir; .gm/pool/held-rows.json is {"rows":[],"ts":1791659018031}).

  STALE CITATION -- r77's row text cites agentplug-host/src/registry.rs:1387 and agentplug-runner/src/daemon.rs:3546. The live tree has last_active at registry.rs 1370/1378/1476 and daemon.rs 2284. Those cited lines are stale; do not re-derive from them.

  DEFERRED, NOT DONE: clause 2's site rs-plugkit is clean at this head and workable (codesearch literal 'retry' over rs-plugkit/crates/plugkit-core/src, dispatch 1791668653491-500-96fbb99f23c2e67d, shows a retry hint only in pool_slots/floor.rs:28 'floor_gate_denied ... retry {verb}' and wait.rs:56 'retryable': true -- nothing in the admission path and no read-only dispatch class), but it cannot ship alone: the row is one acceptance with three clauses and the id is occupied. Owner decision needed: mint a fresh row id for the three clauses, or confirm the id may be re-scoped over r77's completed receipt.

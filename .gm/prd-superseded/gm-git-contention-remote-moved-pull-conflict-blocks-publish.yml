text: 'Measured 2026-10-10, SESSION_ID orch-main, spoint walk: two gm-instructivity lanes in one walk were blocked by the same c:/dev/gm git state. orch-main-r131: git_push gate_denied "source_ref ''HEAD'' is symbolic" (13 refs), recovered by git_pull which conflicted AGENTS.md, gm-mcp and rs-plugkit and aborted with the tree restored. orch-main-r135 (row LAMPORT-n-r129-4): git_push gate_denied remote_moved, git_pull recovery conflicted the same three paths, commit 6e6fe49a5b left local-only, blocker LAMPORT-n-r129-4-blocker-orch-main-r135. Meanwhile five other live lanes (git pull dirty submodules, rs-plugkit AGENTS.md sweep, prd.yml foreign rows, spool error receipt, witness log clobber) each hold or want c:/dev/gm''s git, so the single-writer rule is satisfied only accidentally and every publisher after the first blocks. The skills record the single-writer rule but no recovery recipe for this exact state, and no rule that a blocked publisher files the state instead of retrying a pull that conflicts the same three paths again. Acceptance: gm exposes one verb (or one documented sequence) that takes c:/dev/gm from remote_moved + conflicted-pull to pushed, and the gm-orchestrate / gm-prd skills name it, naming the measured denials above, so a lane that hits gate_denied remote_moved runs that sequence instead of a second conflicting git_pull; witness by driving one lane from the denied state to a pushed sha and reading ci-status on it.'

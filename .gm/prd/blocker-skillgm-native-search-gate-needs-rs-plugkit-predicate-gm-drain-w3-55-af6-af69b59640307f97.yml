body: 'Row BLOCKER-SKILLGM-native-search-gate-blocker-gm-drain-w1-32 stays pending. ELIMINATE (receipt .gm/receipts/BLOCKER-SKILLGM-native-search-gate-blocker-gm-drain-w1-32/02-ELIMINATE.md) refuted H3: rs-plugkit has no Glob/Grep tool-name predicate (dispatches 1791969834289-500-bbf1a824ae841de2, 1791969839329-500-9b6f98628063e24) and DEVIATION_TABLE (rs-plugkit/crates/plugkit-core/src/orchestrator/deviations.rs:27-173) has no native-search kind. The ban exists only as prose (gm-config/prose/lean-p7.md:19, lean-p8.md:19, lean-p9.md:17, entry.md:121). Unblock: add a predicate to the registry (or a jit hook under fsm.hooks_dir) that matches native search tool selection, add a deviation kind to DEVIATION_TABLE with a gates.predicate binding, then rebuild rs-plugkit in CI only (wasm32-wasip1 --features slim) and witness through a live dispatch. Session that does this needs rs-plugkit write access and a CI run id as witness. blocked_by (gm-drain-bounded-19, SPECIFY receipt .gm/receipts/BLOCKER-SKILLGM-native-search-gate-needs-rs-plugkit-predicate-gm-drain-w3-55/01-SPECIFY.md): the guest receives only gm verb dispatches and cannot observe a native Glob/Grep call, so a registry predicate and DEVIATION_TABLE kind have no emitter (fsm_vendor.rs:439 forbids such a kind). Enforcement needs a harness PreToolUse hook under hooks/, which is a Section 4 one-way door. Missing fact: user decision on that hook. Verb that supplies it: mutable-add of the decision, then prd-add of the hook row.'

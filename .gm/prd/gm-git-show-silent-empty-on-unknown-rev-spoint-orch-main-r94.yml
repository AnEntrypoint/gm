id: gm-git-show-silent-empty-on-unknown-rev-spoint-orch-main-r94
title: git_show answers ok with no object for an unresolvable rev
text: 'Measured 2026-10-10 (SESSION_ID orch-main): git_show {rev:"15455199828a23f27957c9904e271efd1c5cf708"} with and without stat returned ok:true and only the echoed rev, in C:/dev/gm, C:/dev/gm/agentplug and C:/dev/spoint. A row delivered with that sha cannot be witnessed: an absent object and a present object are indistinguishable in the reply, so a fabricated or unpushed sha reads as a delivered commit. Fix: git_show shall fail loudly (error_code naming the rev and the repo) when the rev does not resolve, and always carry the object/commit fields when it does. Witness: dispatch git_show on a rev known absent and assert a non-ok reply naming the rev; dispatch on a known HEAD and assert the fields are present.'
session_id: orch-main
status: completed
witness: 'git_show {rev:''15455199828a23f27957c9904e271efd1c5cf708'', stat:true} in C:/dev/gm (session orch-main-r94-witness2) -> ok:false, error_code git_show_rev_unresolved, error ''rev 15455199828a23f27957c9904e271efd1c5cf708 does not resolve in C:/dev/gm: fatal: bad object ...'', repo carried; git_show {rev:''HEAD'', stat:true} in C:/dev/gm -> ok:true with output carrying commit 3f77737d6b54101f47fd1f504b9546acdbe24751, author, date, subject and stat (dispatch 1791662857284-500-d4c97075c06e6b5e); same unknown rev in C:/dev/spoint -> ok:false naming rev and repo (dispatch 1791662883375-500-ba01cc82a18b7e51). Fix: rs-plugkit 500fc10070a2a4cbd9689eb0b85cb0a0d8f5a966 ''fix(git_show): fail loudly when the rev does not resolve''; CI green on 6d611e2 / 42efa1c / f4fac64; released wasm swapped in and the new behaviour is live in dispatch.'

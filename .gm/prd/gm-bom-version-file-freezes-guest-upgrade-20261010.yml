id: gm-bom-version-file-freezes-guest-upgrade-20261010
acceptance: (1) a version file whose content carries a leading U+FEFF is read as its semver after the BOM is stripped; (2) it is never classified as a local-dev sideload; (3) a BOM'd .version no longer freezes guest upgrades (reconcileGuest proceeds to upgrade); (4) a genuinely non-semver marker (e.g. 'dev', 'local', 'abc') still classifies as local-dev-sideload; (5) live witness (id, hash, ts) from a real dispatch reproducing the freeze with a BOM'd .version in a scratch home and never touching C:\Users\user\.agentplug, then showing fixed code reading it as semver.
subject: BOM'd plugins/<name>.version freezes guest upgrades as a fake local-dev sideload
text: 'Live defect 2026-10-10: C:\Users\user\.agentplug\plugins\gm.version bytes are \u{feff}0.1.1520 (leading U+FEFF). The agentplug-runner plugin-update poll refuses it as ''not recognized X.Y.Z semver'' and writes gm.local-dev-sideload.json (installed_marker "\u{feff}0.1.1520"); gm-mcp/src/release-bridge.js reconcileGuest then returns {outcome:''skipped'', reason:''local-dev-sideload''}, so gm.wasm is never upgraded from AnEntrypoint/plugkit-bin again. Live daemon stuck on 0.1.1520 while plugkit-bin is at 0.1.1539, silently. Same silent-BOM class as row gm-reverify-silent-on-unparsable-prd (spoint orch b186): a BOM turns a live upgrade path into a permanent silent no-op mislabelled as an intentional developer sideload. Fix at source on BOTH the Rust runner (agentplug/crates/agentplug-runner/src/download.rs) and the JS bridge (gm-mcp/src/release-bridge.js, gm-mcp/src/self-update.js, anything reading .version): strip a leading U+FEFF before any semver test/compare of an installed version file. Keep real sideload detection intact: a genuinely non-semver marker stays a sideload.'

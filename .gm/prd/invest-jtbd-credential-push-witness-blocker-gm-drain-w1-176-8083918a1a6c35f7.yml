subject: 'Blocker: no-secrets-in-diff is not wired into git_push, so the row''s named witness cannot return a denial'
body: 'Row INVEST-JTBD-CREDENTIAL-PUSH-WITNESS names git_push as the gate. Source does not support that. pred_no_secrets_in_diff (rs-plugkit/crates/plugkit-core/src/orchestrator/transitions.rs:641-691) has one caller, the predicate registry (dispatch 1791958554889-500-2769de1d63fbb30e). The predicate is a closure gate on the G_SWEEP -> COMPLETE transition in gm-config/fsm/graph.json lines 1531-1549 (dispatch 1791958561065-500-5c834ff43d0c26f). git_push has no path to it. Receipts: .gm/receipts/INVEST-JTBD-CREDENTIAL-PUSH-WITNESS/01-SPECIFY.md and 02-PROVE.md. To close the row, either (a) wire pred_no_secrets_in_diff into the git_push staging path in rs-plugkit (a rebuild with --features slim and a live git_push denial witness), or (b) the human decides the row is closed by the G_SWEEP gate instead, which needs a witness on that transition. Pending the scope decision in mutable JTBD-CREDENTIAL-KEEPOUT-SCOPE.'

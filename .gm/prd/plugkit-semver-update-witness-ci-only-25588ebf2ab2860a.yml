id: PLUGKIT-SEMVER-UPDATE-WITNESS-ci-only
subject: Fix ensure_plugin_installed_via_github so a same-version sha drift re-downloads the release wasm (CI-only)
body: 'Witness PLUGKIT-SEMVER-UPDATE-WITNESS failed (dispatch 1791890969605-500-a6b069bd5496b16e swap; restore 1791891428804-500-2306236e1d7e64d9). Root cause in agentplug/crates/agentplug-runner/src/download.rs: ensure_plugin_installed_via_github returns Ok(dest) early when dest exists and plugins/gm.version equals the latest release, before the wasm sha256 sidecar is fetched, so the Equal-version sha-drift branch of refresh_plugin_if_stale never replaces the file. refresh_plugin_if_stale then returns Ok(Some(latest)) and daemon.rs logs "downloaded+verified" (about line 3507) on a no-op. Fix: compare the remote sidecar sha with installed_wasm_sha256 before the version short-circuit, and return Ok(None) unless the wasm changed. Verification: CI only (local cargo blocked by hook). Re-witness after the agentplug pin advances: sideload backup agent gm.wasm.bak-0.1.1618-2026-10-12T18-26-51-200Z, expect daemon-status loaded_plugin_content_sha256.gm to return to db42b8dc21646809ca042cc99814539468ccfb56c6315ec5720ce435d10cb0de within about two polls. Receipts: .gm/receipts/PLUGKIT-SEMVER-UPDATE-WITNESS/04-08.'
session_id: gm-fin-17
status: pending

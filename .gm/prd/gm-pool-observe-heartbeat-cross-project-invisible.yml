title: pool-observe live_heartbeats cannot see a heartbeat written in another project
kind: defect
text: 'Measured 2026-10-10, SESSION_ID orch-main, spoint walk tick 87: pool-observe with cwd C:/dev/spoint reported live=20 (ListAgents), live_heartbeats=3, live_sessions=[orch-main-r132, orch-main-r136], live_rows_total=10, while 17 of the 20 live lanes were working in C:/dev/gm and had been briefed to write .gm/pool/<session>.live. Those files land in C:/dev/gm/.gm/pool/, which pool-observe never reads, so the dedupe sees 3 of 20 and slots.advertised keeps offering rows a live worker already holds -- the exact failure the heartbeat step exists to prevent (measured 2026-10-10: advertised slots naming held rows at live_heartbeats 0 and again at live=18). A gm walk fans lanes across two projects (the spoint walk runs gm-instructivity lanes in C:/dev/gm), so the heartbeat store is cross-project by construction, and the dedupe is blind to every lane outside cwd. Witness: pool-observe dispatch 1791669162546-500-2e93f3ff529098fe (live 20, live_heartbeats 3, live_sessions_total 2, live_rows_unmatched_total 11). Acceptance: pool-observe reports live_heartbeats counting .live files from every project root a live lane was launched into (a roots list in the body, or a shared heartbeat dir), so at 20 live lanes with heartbeats written, live_heartbeats is 20 and live_rows_unmatched does not name a surface a live lane holds; witness by dispatching pool-observe from C:/dev/spoint while a lane holds a .live in C:/dev/gm and reading the count back.'

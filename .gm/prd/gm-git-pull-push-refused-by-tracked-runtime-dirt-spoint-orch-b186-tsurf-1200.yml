text: 'Measured 2026-10-10 around 12:45-12:55Z. git_push {rev:HEAD} of d408055 was rejected non-fast-forward after a CI autobump; auto_recovery was skipped because porcelain showed .gm/dream-rsi/*/.cycle-state.json, observations.json, .gm/instructions/entry.md and agentplug. Those runtime files change while the daemon runs, so no pull can pass the gate. git_pull {branch:main} then ran past the gate and reported conflicted:true with Failed to merge submodule rs-plugkit (commits don''t follow merge-base); MERGE_HEAD was absent afterwards, and a staged gitlink appeared and later cleared. Related: XYPROB-runtime-state-in-submodules, INVEST-XYPROB-RUNTIME-IGNORE-RS-PLUGKIT. Found by spoint-orch-b186-adv-tsurf-1200.'

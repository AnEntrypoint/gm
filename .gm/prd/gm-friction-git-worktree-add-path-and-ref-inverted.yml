witness: 'Independent session orch-main-r113-sub1, live gm spool dispatch against the real verb (cwd C:/dev/gm, HTTP 127.0.0.1:8787/mcp): GREEN dispatch 1791666255326-500-1e86e64483fd8708 = git_worktree_add {path:''C:/dev/gm-publish'', ref:''origin/main''} -> created:true, C:/dev/gm-publish exists detached HEAD 35a76fe at origin/main with a .git file (gitdir: C:/dev/gm/.git/worktrees/gm-publish). RED baseline before the fix: dispatch 1791665422320-500-11b234cb055dca9a = fatal: invalid reference: C:/dev/gm-publish. Refusal acceptance: dispatch 1791666277492-500-d3db5d16ef297d1f naming checked-out branch ''main'' -> fatal: ''main'' is already used by worktree at ''C:/dev/gm''. Cleanup: removed+pruned, git_worktree_list back to one entry. Fix rs-plugkit crates/plugkit-core/src/wasm_dispatch/verbs/git.rs git_worktree_add builds ''git worktree add [-b <ref>] <path> [<ref>]''; accepted fields unchanged (path, ref, create, allowOutsideRoot). Pushed sha 915f6542e27a1e50481b0fa73ec4fd42f960b044 (fix 5bb1e108f102235ae9d68a44bf9c3b471c51cd64), CI success (native-check, publish/plan, publish/bump, publish/release).'

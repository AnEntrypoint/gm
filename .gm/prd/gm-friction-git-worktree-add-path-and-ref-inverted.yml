id: gm-friction-git-worktree-add-path-and-ref-inverted
SESSION_ID: orch-main-r113
subject: 'git_worktree_add must take path as the worktree directory and ref as the commit-ish: after the fix, {path:''C:/dev/gm-publish'', ref:''origin/main''} creates a worktree detached at origin/main, and a call naming an already-checked-out branch is refused with an error naming that branch'
text: 'Measured defect 2026-10-10 (SESSION_ID orch-main, cwd C:/dev/gm): the verb built ''git worktree add <ref> <root-prefixed path>'', so the field named path was used as the commit-ish and every call died with ''fatal: invalid reference: <path>'' (RED dispatch 1791665422320-500-11b234cb055dca9a). No argument order created a worktree. Fix: rs-plugkit crates/plugkit-core/src/wasm_dispatch/verbs/git.rs git_worktree_add now builds ''git worktree add [-b <ref>] <path> [<ref>]'', path used verbatim as the directory (no project-root prefix when absolute), accepted body fields unchanged (path, ref, create, allowOutsideRoot). Pushed rs-plugkit main 915f6542e27a1e50481b0fa73ec4fd42f960b044 (fix 5bb1e108f102235ae9d68a44bf9c3b471c51cd64), CI success. Live GREEN witness from independent session orch-main-r113-sub1: dispatch 1791666255326-500-1e86e64483fd8708 (C:/dev/gm-publish detached HEAD 35a76fe, .git file present), refusal dispatch 1791666277492-500-d3db5d16ef297d1f ("fatal: ''main'' is already used by worktree at ''C:/dev/gm''"), test worktree removed and pruned. Parent c:/dev/gm pin bump left to row gm-parent-rs-plugkit-pin-blocked-by-concurrent-conflict (pull conflicts on AGENTS.md, gm-mcp, rs-plugkit).'
session_id: orch-main-r113

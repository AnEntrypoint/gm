body: |-
  Blocks gm-pool-observe-heartbeat-cross-project-invisible (stays pending). Stage reached: PROVE failed. Receipts: .gm/receipts/gm-pool-observe-heartbeat-cross-project-invisible/01-SPECIFY.md and 02-PROVE.md.
  Measured by gm-drain-w2-189: a fresh valid three-line .live written at C:/dev/gm/.gm/pool (dispatch 1791961910482-500-7a2469fc39111063) is counted from its own root (live_sessions includes gm-drain-w2-189), but pool-observe from C:/dev/spoint with body.roots [C:/dev/gm] (dispatches 1791961932137-500-4cb0d53258cde72c and 1791961917971-500-2c63683ae32ef670 without roots) never counts it, and live_heartbeats reads 0 or 1 across calls. The roots code exists (rs-plugkit/crates/plugkit-core/src/orchestrator/pool_slots/observe.rs heartbeat_roots -> state.rs slot_parts -> heartbeats.rs read_heartbeat_dir), so the acceptance is unmet at the live entry point.
  Leading hypothesis H1: heartbeat_roots reads an extra root without a host grant (host_fs_allow_root, see AGENTS.md outside_root_read_granted), so the read returns empty and the file is skipped. Probe to separate it: serve a pool-observe whose roots resolve inside an already granted tree, and compare its count with the out-of-root count.
  Fix surface: rs-plugkit observe.rs/heartbeats.rs plus a slim wasm rebuild; verification is CI only (no local cargo). Not attempted in this run. Next wave: an rs-plugkit executor takes H1 with that probe and witnesses the live roots count on spoint.

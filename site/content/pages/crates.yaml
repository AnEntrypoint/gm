id: crates
title: Rust crates behind gm
description: "gm = skill + MCP server (tool interface agents call) that coding agents install to drive coding, refactoring, debugging work. Page lists four Rust repos in gm source tree. Title calls them crates: each repo = Cargo package or Cargo workspace of packages. Page lists what each owns: rs-plugkit (orchestrator, runs gm workflow state machine), rs-search (search ranking), rs-codeinsight (code structure parsing), agentplug (native host that loads rs-plugkit). rs-exec and rs-learn retired: repos archived, each README names rs-plugkit as replacement. Retired section at end of page lists them."
layout: article

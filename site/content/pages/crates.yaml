id: crates
title: Rust crates behind gm
description: "gm is a skill and an MCP server (a tool interface that agents call) that coding agents install to drive coding, refactoring and debugging work. This page lists the four Rust repositories in gm's source tree and what each one owns: rs-plugkit (the orchestrator, which runs gm's workflow state machine), rs-search (search ranking), rs-codeinsight (code structure parsing) and agentplug (the native host that loads rs-plugkit). rs-exec and rs-learn are retired: their repositories are archived, and each README names rs-plugkit as its replacement. The Retired section at the end of the page lists them."
layout: article

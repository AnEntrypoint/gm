id: made-with
title: "gm showcase: selected AnEntrypoint repositories"
description: "gm = skill (agent reads instructions from SKILL.md) + MCP server (tool server agents call over stdio or HTTP). For devs using Claude Code, Cursor, Gemini CLI, or Codex. Keeps plan of rows. Each row = one task, stored as one file under .gm/prd/. Row resolved only when real check records result on it. Resolving moves row out of .gm/prd/ into append-only log .gm/prd-log.jsonl. gm refuses let agent mark task finished until three hold: every row resolved; CI result recorded for HEAD; no submodule drifted from recorded commit. New to gm? Install gm from distribution page, or read gm skills page."
layout: article

id: made-with
title: "gm showcase: selected AnEntrypoint repositories"
description: "gm is a skill (instructions the agent reads from a SKILL.md file) and an MCP server (a tool server that agents call over stdio or HTTP) for developers who use Claude Code, Cursor, Gemini CLI or Codex. It keeps a plan of rows. Each row is one task, stored as one file under .gm/prd/. A row is resolved only when a real check records its result on it. Resolving a row moves it out of .gm/prd/ into the append-only log .gm/prd-log.jsonl. gm refuses to let the agent mark a task finished until three things hold. Every row is resolved. A CI result is recorded for HEAD. No submodule has drifted from its recorded commit. New to gm? Install gm from the distribution page, or read the gm skills page."
layout: article

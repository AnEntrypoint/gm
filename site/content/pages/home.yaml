id: home
title: gm
hero:
  heading: "gm"
  subheading: "a check layer for the coding agent you already run: it holds the agent to a list of recorded checks before it calls a task done."
  body: "You describe a change and the agent builds it. Before the agent can call a task done, every plan row (a task file in .gm/prd/) must be closed, a CI result for HEAD must be recorded, and submodules must be clean."
  badges:
    - { label: "installs into Claude Code, Cursor, Gemini CLI and Codex" }
    - { label: "one entry skill, installed as /gm" }
  ctas:
    - { label: "Install gm", href: "https://github.com/AnEntrypoint/gm#install", primary: true }
    - { label: "Read the paper", href: "./paper/" }
    - { label: "Star on GitHub", href: "https://github.com/AnEntrypoint/gm" }
    - { label: "Discord", href: "https://discord.com/invite/c9VV59MKNr" }
features:
  heading: "what gm does"
  items:
    - name: "a plan the agent cannot skip"
      desc: "each plan row is a file, .gm/prd/<id>.yml, and the agent works through the rows. A row closes only with the recorded result of a real check."
    - name: "one graph, one walk"
      desc: "A walk is one run of the graph. The work runs as a graph of steps, listed in gm-config/fsm/graph.json. The steps include principles, each a discipline that the agent applies to the code. The agent moves along edges (the links from one step to the next), and a gate on an edge can refuse a move. Independent steps run in parallel subagents (separate agents that the main agent starts)."
    - name: "gates that block a move"
      desc: "Gate predicates (named checks) on the graph's edges block a move until their check passes, and advisory predicates only report. Gates check work state (closed rows, resolved questions, a clean work tree), delivery (a marker file that names HEAD, and clean submodules) and the diff (no synthetic test files, no hedge language). The CI gate passes when the marker, .gm/exec-spool/.ci-validated, has a head_sha equal to HEAD. gm writes that marker after the ci-status verb reports success or no applicable workflow for HEAD, so a no applicable workflow result passes without a CI run. A hand-written marker that names HEAD passes too, so the gate shows that CI reported success or no applicable workflow for HEAD, not that CI ran."
    - name: "unknowns get resolved by running code"
      desc: "An open question is recorded with the mutable-add verb and stays open until the mutable-resolve verb closes it. The exec_js verb runs a claim against real code, the codesearch verb finds where something lives, and the recall verb brings back what the project already stored."
    - name: "memory searched by meaning"
      desc: "recall ranks stored memories by meaning, using embeddings (vectors that place text by meaning), and blends that with recency, with a 30-day half-life."
    - name: "one tool for every verb"
      desc: "gm adds one MCP tool, gm_codemode. Its short JavaScript code calls gm verbs as functions, such as gm.codesearch({query: ...}), and gm.list() lists them all."
quickstart:
  heading: "install (needs Node.js; drop -g for the current project only)"
  lines:
    - { kind: "cmd", text: "npx github:AnEntrypoint/gm -g" }
examples:
  heading: "read further"
  items:
    - { name: "the core components", desc: "rs-plugkit, rs-search and rs-codeinsight: what each does.", cta: "read the crates", href: "./crates/" }
    - { name: "the skills", desc: "gm is the entry skill. gm-orchestrate runs parallel work, gm-hop applies one principle to one surface (a path in the code), gm-prd closes one plan row, and gm-continue wraps up a finished walk. gm-orchestrate and gm-hop are loaded only by gm.", cta: "read the skills", href: "./skills/" }
    - { name: "distribution", desc: "how gm is installed for each agent host, and how to check the runner (agentplug-runner, the native WASM host that loads rs-plugkit).", cta: "read how it installs", href: "./distribution/" }

id: home
title: gm
hero:
  heading: "gm"
  subheading: "a check layer for the coding agent you already run: it stops the agent from calling a task done until the checks pass."
  body: "For developers who use Claude Code, Cursor, Gemini CLI or Codex. You describe a change and the agent builds it. gm keeps that speed and adds a check at the end. Before the agent can say a task is done, every plan row must be closed, the CI marker that the agent writes must name HEAD, and submodules must be clean. A plan row is one task the agent must finish. A gate is a check the system runs in code before the agent may move to its next step. A failed gate names the gate and the condition that failed, so the agent fixes that instead of arguing it is finished. Install with npx github:AnEntrypoint/gm -g, which needs Node.js. Drop -g to install into the current project only."
  badges:
    - { label: "installs into Claude Code, Cursor, Gemini CLI and Codex" }
    - { label: "146 states in the state machine; 129 are principles" }
    - { label: "26 gate predicates; 24 can block a step, 2 only advise" }
    - { label: "18 test files in gm-mcp/test/" }
    - { label: "one entry skill, installed as /gm" }
  ctas:
    - { label: "Install gm", href: "https://github.com/AnEntrypoint/gm#install", primary: true }
    - { label: "Read the paper", href: "./paper/" }
    - { label: "Star on GitHub", href: "https://github.com/AnEntrypoint/gm" }
    - { label: "Discord", href: "https://discord.com/invite/c9VV59MKNr" }
features:
  heading: "what gm does, in the order you meet it"
  items:
    - name: "a plan the agent cannot skip"
      desc: "each task is a row file, .gm/prd/<id>.yml, and the agent works through the rows. A row closes only with the recorded result of a real check. The walk completes only when every row is closed. Once a row exists, the agent works it without asking you questions it can answer itself."
    - name: "one graph, one walk"
      desc: "The work runs as a graph of nodes, listed in gm-config/fsm/graph.json. Most nodes are principles, and the graph also holds 8 tensions, 7 gate-kind states and 2 terminal nodes. A principle is one discipline from a method book that the agent applies to the code. The agent moves between nodes along edges, and the gate predicates on an edge decide whether the move is allowed. A refused move names the gate and the condition that failed. Independent steps run in parallel subagents."
    - name: "gates that name what failed"
      desc: "Gate predicates on the graph's edges block a move until their check passes, and advisory predicates only report. They check work state (open rows, unresolved questions, a clean work tree), delivery (a CI-validated marker, clean submodules) and the diff (no mock test files, no hedge language). The CI gate compares a marker file with HEAD, and the agent writes that marker, so the gate records intent and does not prove that CI ran."
    - name: "unknowns get resolved by running code"
      desc: "an open question is recorded as a mutable with mutable-add, and it stays open until the agent answers it. The agent tests one hypothesis at a time against real code, reads the real result, and closes the mutable with mutable-resolve. exec_js runs the claim, codesearch finds where something lives, and recall brings back what the project already stored."
    - name: "memory searched by meaning"
      desc: "recall ranks stored memories by meaning, using embeddings (vectors that place text by meaning), and blends that with recency, with a 30-day half-life. With the default backend, embeddings are computed on the machine by the shared agentplug-bert plugin, so no text goes to an external embedder."
    - name: "one tool for every action"
      desc: "the gm MCP server exposes one tool, gm_codemode. It runs a short JavaScript body in which every gm verb is a function, such as gm.codesearch(...), and gm.list() shows the verbs that are available."
whatsNew:
  heading: "what the current build does"
  items:
    - { summary: "the stdio server exits once its client disconnects and its in-flight dispatches finish" }
    - { summary: "GM_MCP_DAEMON_HEARTBEAT_STALE_MS overrides the daemon heartbeat bound, which defaults to 20000 ms" }
    - { summary: "bin/gm is a command-line entrypoint: a plain shell runs any verb with no MCP client" }
    - { summary: "gm-mcp checks its deployed bundle for staleness every 30 seconds; GM_MCP_BUNDLE_DRIFT_INTERVAL_SECONDS changes that interval" }
    - { summary: "chrome is the headful CDP browser verb" }
    - { summary: "dispatch replies are capped at 24,000 characters; the rest goes to a spill file, and gm_result reads that spill file" }
    - { summary: "release archives publish with a SHA-256 sidecar, and the installer ships every release skill, not only gm" }
quickstart:
  heading: install in every detected agent host
  lines:
    - { kind: "cmd", text: "npx github:AnEntrypoint/gm -g" }
examples:
  heading: read further
  items:
    - { name: "the complete discipline", desc: "the paper: the state machine, the gates, the pool and hops, and the operating rules the agent runs under.", cta: "read the paper", href: "./paper/" }
    - { name: "every rust crate", desc: "rs-plugkit, rs-search and rs-codeinsight: what each does and what it is responsible for. rs-exec and rs-learn are retired.", cta: "read the crates", href: "./crates/" }
    - { name: "the skills", desc: "gm is the entry skill. gm-orchestrate runs the pool, gm-hop applies one principle to one surface, gm-prd closes one plan row, and gm-continue hands off a finished walk.", cta: "read the skills", href: "./skills/" }
    - { name: "distribution", desc: "how gm is installed, how the local MCP server is registered, how to check the runner's build, and where each release is published.", cta: "read how it installs", href: "./distribution/" }

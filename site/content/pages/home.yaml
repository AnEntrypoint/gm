id: home
title: gm
hero:
  heading: "gm"
  subheading: "check layer for coding agent you already run: gm hold agent to list of recorded checks before task done."
  body: "You describe change, agent build it. Before agent call task done: every plan row (task file in .gm/prd/) closed, continuous integration (CI) result for HEAD recorded, submodules clean."
  badges:
    - { label: "installs into Claude Code, Cursor, Gemini CLI and Codex" }
    - { label: "one entry skill, installed as /gm" }
  ctas:
    - { label: "Install gm", href: "https://github.com/AnEntrypoint/gm#install", primary: true }
    - { label: "Read the paper", href: "./paper/" }
    - { label: "Star on GitHub", href: "https://github.com/AnEntrypoint/gm" }
    - { label: "Discord", href: "https://discord.com/invite/c9VV59MKNr" }
features:
  heading: "what gm does"
  items:
    - name: "a plan the agent cannot skip"
      desc: "each plan row = file .gm/prd/<id>.yml, agent work thru rows. row close only w/ recorded result of real check."
    - name: "one graph, one walk"
      desc: "A walk = one run of graph. Work runs as graph of steps, listed in gm-config/fsm/graph.json. Steps include principles, each discipline agent applies to code. Agent moves along edges (links from one step to next); gate on edge can refuse move. Independent steps run parallel in subagents (separate agents main agent starts)."
    - name: "gates that block a move"
      desc: "Gate predicates (named checks) on graph edges block move till check pass. Advisory predicates only report. Gates check work state (closed rows, resolved questions, clean work tree), delivery (marker file naming HEAD, clean submodules) and diff (no synthetic test files, meaning diff add no test file that stay in repo, like *.test.* or *.spec.*, or test, tests or __tests__ directory; and no hedge language, meaning no deferral phrase in prose files, like 'todo later' or 'for now we'). CI gate pass when marker, .gm/exec-spool/.ci-validated, has head_sha equal HEAD. gm write that marker after ci-status verb report success or status no_applicable_workflow for HEAD. no_applicable_workflow result pass without CI run. Hand-written marker that name HEAD also pass. So gate show CI reported success or no_applicable_workflow for HEAD, not that CI ran."
    - name: "unknowns get resolved by running code"
      desc: "An open question is recorded with the mutable-add verb and stays open until the mutable-resolve verb closes it. The exec_js verb runs a claim against real code, the codesearch verb finds where something lives, and the recall verb brings back what the project already stored."
    - name: "memory searched by meaning"
      desc: "recall rank stored memory by meaning, use embedding (vector place text by meaning), blend with recency. Recency term decay 30-day half-life."
    - name: "one tool for every verb"
      desc: "gm adds one MCP tool, gm_codemode. Its short JavaScript code calls gm verbs as functions, such as gm.codesearch({query: ...}), and gm.list() lists them all."
quickstart:
  heading: "install (needs Node.js; no npm, no npx)"
  lines:
    - { kind: "cmd", text: "curl -fsSL https://raw.githubusercontent.com/AnEntrypoint/gm/main/install.sh | sh" }
    - { kind: "cmd", text: "irm https://raw.githubusercontent.com/AnEntrypoint/gm/main/install.ps1 | iex" }
examples:
  heading: "read further"
  items:
    - { name: "the core components", desc: "rs-plugkit = WebAssembly (WASM) guest. Does orchestration, spool verbs, memory, code search. rs-search ranks candidate id lists by Reciprocal Rank Fusion. Tokenizes text for indexing and search. rs-codeinsight = fast codebase analyzer, powered by tree-sitter parser lib.", cta: "read the crates", href: "./crates/" }
    - { name: "the skills", desc: "gm = entry skill. gm-orchestrate runs parallel work. gm-hop applies one principle to one surface (path in code). gm-prd closes one plan row. gm-continue wraps up finished walk. gm-orchestrate and gm-hop invoked only by gm, not meant to load direct.", cta: "read the skills", href: "./skills/" }
    - { name: "distribution", desc: "how gm install per agent host, how check runner: agentplug-runner, native WASM host loads rs-plugkit.", cta: "read how it installs", href: "./distribution/" }

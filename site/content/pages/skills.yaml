title: skills
description: gm (glootius maximus) ships one skill, gm (the gm-skill npm package), a boot-edge entry point carrying only the ABI an agent needs before the orchestrator takes over, every harness, no phase prose of its own. You dispatch plugkit's instruction verb each turn to read phase prose, orchestration state, and guardrails; you are the state machine, plugkit is the durable memory and gate you drive. What used to be a fourteen-skill chain is now a single dispatch surface.

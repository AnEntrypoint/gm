id: skills
title: skills
description: "gm (glootius maximus) boots on one skill, gm (the gm-skill npm package): a boot-edge entry point carrying only the ABI an agent needs before the orchestrator takes over, the same across every harness, with no phase prose of its own. You dispatch plugkit's instruction verb each turn to read phase prose, orchestration state, and guardrails -- you are the state machine, and plugkit is the durable memory and gate you drive. What used to be a fourteen-skill chain is now a single dispatch surface, with gm-orchestrate, gm-hop, gm-prd and gm-continue shipped beside it to run the walk itself."

id: skills
title: The gm skills
description: "gm = skill + MCP server for coding agents. Keeps plan of tasks, refuses let agent mark task done until checks pass. Each task = plan row. Skills also call plan row a PRD row. Plan row = one file under .gm/prd/, closes only with recorded witness, reply of read dispatch named by its dispatch id. gm for devs who run coding agents such as Claude Code, Cursor, Codex or Gemini CLI. Install gm (commands on page Install gm and check it works), then ask agent use gm skill, the /gm entry skill. This page lists gm skills and orchestrator verbs, named gm operations agent calls."

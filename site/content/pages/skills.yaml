id: skills
title: The gm skills
description: "gm is a skill and MCP server for coding agents. It keeps a plan of tasks and refuses to let the agent mark a task done until its checks pass. Each task is a plan row. The skills also call a plan row a PRD row. A plan row is one file under .gm/prd/, and it closes only with a recorded witness, the reply of a read dispatch named by its dispatch id. gm is for developers who run coding agents such as Claude Code, Cursor, Codex or Gemini CLI. Install gm (the commands are on the page Install gm and check it works), then ask your agent to use the gm skill, the /gm entry skill. This page lists the gm skills and the orchestrator verbs, the named gm operations an agent calls."

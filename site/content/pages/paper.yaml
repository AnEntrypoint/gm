title: "gm: a skill that gates AI coding agents on real command output"
subtitle: "How gm's checks, gates, walks fit together. Check = command run, pass/fail on output. Gate = condition on one move between states; failed gate refuses move. Walk = one run of gm state machine, driven to COMPLETE. For devs already using AI coding agent."
description: "gm = skill for Claude Code, Cursor, Gemini CLI, Codex. Gate agent on real command output. Refuse let agent mark task finished until checks on that output pass."

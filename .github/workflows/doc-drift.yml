name: doc-drift

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - docs/**
      - site/**
      - skills/**
      - .agents/**
      - scripts/**
      - bin/**
      - gm-config
      - gm-config/**
      - rs-*
      - rs-plugkit/**
      - gm-mcp
      - gm-mcp/**
      - agentplug
      - agentplug-*
      - agentplug/**
      - package.json
      - README.md
      - AGENTS.md
      - SKILLS.md
      - CONTRIBUTING.md
      - .github/workflows/**
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: gm-doc-drift-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(install\.sh$|install\.ps1$|docs/|site/|skills/|\.agents/|scripts/|bin/|gm-config$|gm-config/|rs-plugkit$|rs-plugkit/|gm-mcp$|gm-mcp/|(agentplug|rs-)[A-Za-z0-9_-]*(/|$)|package\.json$|README\.md$|AGENTS\.md$|SKILLS\.md$|CONTRIBUTING\.md$|\.github/workflows/[^/]+\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  doc-checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 gm-config
      - id: gm-mcp-pin
        run: echo "sha=$(git ls-tree HEAD gm-mcp | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/gm-mcp
          ref: ${{ steps.gm-mcp-pin.outputs.sha }}
          path: gm-mcp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gm-mcp/package-lock.json
      - run: node scripts/scan-doc-drift.mjs
      - run: npm ci --prefix gm-mcp --no-audit --no-fund --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high --prefix gm-mcp
      - id: license-checker-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/license-checker
          key: license-checker-25.0.1-${{ runner.os }}
      - name: Production npm dependencies carry only allowlisted licenses
        run: |
          if [ "${{ steps.license-checker-cache.outputs.cache-hit }}" != "true" ]; then
            npm install --prefix "$HOME/.cache/license-checker" --no-audit --no-fund --ignore-scripts license-checker@25.0.1
          fi
          "$HOME/.cache/license-checker/node_modules/.bin/license-checker" --production --start gm-mcp --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;BlueOak-1.0.0;Python-2.0;CC-BY-4.0"
      - run: node scripts/check-verb-body-contract.mjs
      - name: Every graph count in the site and docs matches a graph
        run: node scripts/check-doc-counts.mjs
      - name: Every repository path the site and docs name resolves
        run: node scripts/check-doc-paths.mjs
      - name: Both graphs traverse, and shared nodes agree on kind
        run: node scripts/check-graph-traversal.mjs

  repo-hygiene:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: AGENTS.md under 30000 bytes, no BOM, no decorative glyphs in prose
        run: node scripts/check-repo-hygiene.mjs
      - name: Every workflow file parses as YAML
        run: python3 -c "import sys, yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in sys.argv[1:]]" .github/workflows/*.yml

  cargo-audit:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 rs-plugkit agentplug agentplug-treesitter
      - id: cargo-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-tools-audit-0.22.2-deny-0.18.4-${{ runner.os }}-${{ runner.arch }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        with:
          tool: cargo-binstall
      - name: Install cargo-audit 0.22.2 from its release binary
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm cargo-audit@0.22.2
      - name: No vulnerable crate in rs-plugkit or agentplug Cargo.lock
        run: |
          cargo audit --file rs-plugkit/Cargo.lock
          cargo audit --file agentplug/Cargo.lock
      - name: Rust crate licenses match the deny.toml allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.cargo-tools.outputs.cache-hit }}" != "true" ]; then
            cargo binstall --no-confirm cargo-deny@0.18.4
          fi
          node scripts/check-crate-licenses.mjs
      - name: Every tracked binary or vendored font carries an allowlisted license
        run: node scripts/check-binary-licenses.mjs

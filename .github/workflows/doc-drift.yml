name: doc-drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/gm-config
          path: gm-config
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/rs-plugkit
          path: rs-plugkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node scripts/scan-doc-drift.mjs

name: doc-drift

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(docs/|site/|skills/|scripts/|bin/|gm-config$|gm-config/|rs-plugkit$|rs-plugkit/|gm-mcp$|gm-mcp/|agentplug$|agentplug/|package\.json$|README\.md$|AGENTS\.md$|SKILLS\.md$|CONTRIBUTING\.md$|\.github/workflows/(doc-drift|bump-pins|skill-release)\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 gm-config rs-plugkit
      - id: gm-mcp-pin
        run: echo "sha=$(git ls-tree HEAD gm-mcp | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/gm-mcp
          ref: ${{ steps.gm-mcp-pin.outputs.sha }}
          path: gm-mcp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gm-mcp/package-lock.json
      - run: node scripts/scan-doc-drift.mjs
      - run: npm ci --prefix gm-mcp --no-audit --no-fund --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high --prefix gm-mcp
      - run: node scripts/check-verb-body-contract.mjs

  doc-counts:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 gm-config rs-plugkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Every graph count in the site and docs matches a graph
        run: node scripts/check-doc-counts.mjs

  doc-paths:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 gm-config rs-plugkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Every repository path the site and docs name resolves
        run: node scripts/check-doc-paths.mjs

  repo-hygiene:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: AGENTS.md under 30000 bytes, no BOM, no decorative glyphs in prose
        run: node scripts/check-repo-hygiene.mjs
      - name: Every workflow file parses as YAML
        run: python3 -c "import sys, yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in sys.argv[1:]]" .github/workflows/*.yml

  graph-traversal:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 gm-config rs-plugkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Both graphs traverse, and shared nodes agree on kind
        run: node scripts/check-graph-traversal.mjs

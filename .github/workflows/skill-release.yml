name: skill-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gm-skill-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify the shipped default
        run: npm test
      - name: Package current revision without changing source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          mkdir -p release-assets
          tar -czf "release-assets/gm-skill-$VERSION.tar.gz" skills LICENSE
          (cd release-assets && sha256sum "gm-skill-$VERSION.tar.gz" > "gm-skill-$VERSION.tar.gz.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish only to this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" --repo "$GH_REPO" --target "$REVISION" \
            --title "gm skill v$VERSION" --notes "Verified skill bundle from $REVISION. Optional runtime binaries are separate." \
            release-assets/*

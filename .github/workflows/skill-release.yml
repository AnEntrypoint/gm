name: skill-release

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

concurrency:
  group: gm-skill-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Refuse a stale skill manifest
        run: node scripts/build-skill-manifest.mjs --check

      - name: Auto-bump patch version BEFORE packaging
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -e
          git config user.name "lanmower"
          git config user.email "657315+lanmower@users.noreply.github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          if gh release view "v$CURRENT" --repo AnEntrypoint/gm >/dev/null 2>&1; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '$NEW_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            git add package.json
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              echo "[retry] push rejected (attempt $attempt): main moved, rebasing the bump onto it"
              if [ "$attempt" = "5" ]; then echo "::error::bump push rejected 5 times"; exit 1; fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 3))
            done
          else
            NEW_VERSION="$CURRENT"
            echo "v$CURRENT has no release yet: resuming its publish without a second bump"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package skill tarball with checksum
        run: |
          set -e
          mkdir -p release-assets
          VER="${{ steps.bump.outputs.version }}"
          tar -czf "release-assets/gm-skill-$VER.tar.gz" skills
          cd release-assets
          sha256sum "gm-skill-$VER.tar.gz" | sed 's/ \*/  /' > "gm-skill-$VER.tar.gz.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          VER: ${{ steps.bump.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          gh release create "v$VER" \
            --repo AnEntrypoint/gm \
            --title "gm skill v$VER" \
            --notes "Auto-published from gm CI at $SHA" \
            release-assets/*

      - name: Verify every uploaded asset is actually fetchable
        env:
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          base="https://github.com/AnEntrypoint/gm/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            for attempt in 1 2 3 4 5; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name")
              [ "$code" = "200" ] && break
              echo "[retry] $name HTTP $code (attempt $attempt)"
              sleep $((attempt * 5))
            done
            if [ "$code" != "200" ]; then
              echo "::error::published release v$VER's $name is not fetchable (HTTP $code)"
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"

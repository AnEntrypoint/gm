name: skill-release

permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/build-skill-manifest.mjs'

concurrency:
  group: gm-skill-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  manifest-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fail when skills/manifest.sha256 is stale
        run: node scripts/build-skill-manifest.mjs --check

  release:
    if: "${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: auto-bump version') && !startsWith(github.event.head_commit.message, 'chore: refresh skill manifest') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Refresh a stale skill manifest
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -e
          node scripts/build-skill-manifest.mjs
          if git diff --quiet -- skills/manifest.sha256; then
            echo "[ok] skills/manifest.sha256 is current"
            exit 0
          fi
          git config user.name "lanmower"
          git config user.email "657315+lanmower@users.noreply.github.com"
          git add skills/manifest.sha256
          git commit -m "chore: refresh skill manifest"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "[retry] manifest push rejected (attempt $attempt): main moved, rebuilding on origin/main"
            if [ "$attempt" = "5" ]; then echo "::error::manifest push rejected 5 times"; exit 1; fi
            sleep $((attempt * 3))
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            node scripts/build-skill-manifest.mjs
            if git diff --quiet -- skills/manifest.sha256; then echo "[ok] origin/main already has the current skill manifest"; exit 0; fi
            git add skills/manifest.sha256
            git commit -m "chore: refresh skill manifest"
          done

      - name: Auto-bump patch version BEFORE packaging
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          SHA: ${{ github.sha }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.PUBLISHER_TOKEN }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        run: |
          set -e
          git config user.name "lanmower"
          git config user.email "657315+lanmower@users.noreply.github.com"
          release_exists() {
            local err
            if err=$(gh release view "$1" --repo AnEntrypoint/gm 2>&1 >/dev/null); then return 0; fi
            if [ "$err" = "release not found" ]; then return 1; fi
            echo "::error::gh release view $1 failed (not a 404): $err" >&2
            exit 1
          }
          CURRENT=$(git show "$SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          git fetch origin main --quiet
          MAIN_VER=$(git show origin/main:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          if [ "$MAIN_VER" != "$CURRENT" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$MAIN_VER" | sort -V | tail -1)" = "$MAIN_VER" ]; then
            NEW_VERSION="$MAIN_VER"
            git reset --hard origin/main --quiet
            echo "origin/main already at v$MAIN_VER from an earlier attempt: resuming its publish without a second bump"
          elif release_exists "v$CURRENT"; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '$NEW_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            git add package.json
            git commit -m "chore: auto-bump version to $NEW_VERSION"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              echo "[retry] push rejected (attempt $attempt): main moved, re-bumping on origin/main"
              if [ "$attempt" = "5" ]; then echo "::error::bump push rejected 5 times"; exit 1; fi
              sleep $((attempt * 3))
              git fetch origin main --quiet
              git reset --hard origin/main --quiet
              MAIN_VER=$(node -e "console.log(require('./package.json').version)")
              IFS='.' read -r MAJOR MINOR PATCH <<< "$MAIN_VER"
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                p.version = '$NEW_VERSION';
                fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              "
              git add package.json
              git commit -m "chore: auto-bump version to $NEW_VERSION"
            done
          else
            NEW_VERSION="$CURRENT"
            echo "v$CURRENT has no release yet: resuming its publish without a second bump"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package skill tarball with checksum
        run: |
          set -e
          mkdir -p release-assets
          VER="${{ steps.bump.outputs.version }}"
          tar -czf "release-assets/gm-skill-$VER.tar.gz" skills
          cd release-assets
          sha256sum "gm-skill-$VER.tar.gz" | sed 's/ \*/  /' > "gm-skill-$VER.tar.gz.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          release_exists() {
            local err
            if err=$(gh release view "$1" --repo AnEntrypoint/gm 2>&1 >/dev/null); then return 0; fi
            if [ "$err" = "release not found" ]; then return 1; fi
            echo "::error::gh release view $1 failed (not a 404): $err" >&2
            exit 1
          }
          if release_exists "v$VER"; then
            echo "v$VER already published by an earlier attempt: re-uploading its assets"
            gh release upload "v$VER" --repo AnEntrypoint/gm --clobber release-assets/*
          else
            gh release create "v$VER" \
              --repo AnEntrypoint/gm \
              --title "gm skill v$VER" \
              --notes "Auto-published from gm CI at ${{ github.sha }}" \
              release-assets/*
          fi

      - name: Verify every uploaded asset is actually fetchable
        env:
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          base="https://github.com/AnEntrypoint/gm/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            for attempt in 1 2 3 4 5; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name" || true)
              [ "$code" = "200" ] && break
              echo "[retry] $name HTTP $code (attempt $attempt)"
              sleep $((attempt * 5))
            done
            if [ "$code" != "200" ]; then
              echo "::error::published release v$VER's $name is not fetchable (HTTP $code)"
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"
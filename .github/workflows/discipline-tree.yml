name: discipline-tree

permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'skills/dream-rsi/gm-graph.json'
      - 'scripts/check-discipline-tree.mjs'
      - '.github/workflows/discipline-tree.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/dream-rsi/gm-graph.json'
      - 'scripts/check-discipline-tree.mjs'
      - '.github/workflows/discipline-tree.yml'

concurrency:
  group: gm-discipline-tree-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/check-discipline-tree.mjs

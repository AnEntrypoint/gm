name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release after the builds; false runs the builds only"
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_REPO: AnEntrypoint/gm
  GMNEW_AUTO_UPDATE: "0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
            target: x64-linux
            ccache: true
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
            target: arm64-linux
            ccache: true
          - os: macos-latest
            preset: x64-macos-release
            target: x64-macos
            ccache: true
            extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-latest
            preset: arm64-macos-release
            target: arm64-macos
            ccache: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ninja
      - uses: hendrikmuhs/ccache-action@v1.2
        if: matrix.ccache
        with:
          key: ${{ matrix.preset }}
          create-symlink: true
      - name: Configure and build
        shell: bash
        env:
          CCACHE_ARGS: ${{ matrix.ccache && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} -DGMNEW_VERSION=$GMNEW_VERSION ${{ matrix.extra }} $CCACHE_ARGS
          cmake --build build/${{ matrix.preset }}
      - name: gm-tool for the publish job
        if: matrix.target == 'x64-linux'
        uses: actions/upload-artifact@v4
        with:
          name: gm-tool
          path: build/${{ matrix.preset }}/native/components/tool/gm-tool
          if-no-files-found: error
          retention-days: 1
      - name: Chromium for the browser-scope check (linux-arm64)
        if: matrix.target == 'arm64-linux'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/playwright-chromium"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.65.0
          npx playwright-core install --with-deps chromium
          echo "PLAYWRITER_BROWSER_PATH=$(node -p "require('$dir/node_modules/playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
          echo "PLAYWRITER_NO_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        run: build/${{ matrix.preset }}/native/components/tool/gm-tool phase-b build/${{ matrix.preset }}
      - name: Replay witness
        if: matrix.target == 'x64-linux'
        shell: bash
        run: |
          build/${{ matrix.preset }}/native/components/tool/gm-tool check build/${{ matrix.preset }}/native/components/host/gm check-witness-next-context-replay
      - name: Package
        shell: bash
        run: build/${{ matrix.preset }}/native/components/tool/gm-tool package --target ${{ matrix.target }} --build-dir build/${{ matrix.preset }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gmnew-${{ matrix.target }}
          path: dist/gmnew-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: x64-windows-release
            target: x64-windows
          - os: windows-11-arm
            preset: arm64-windows-release
            target: arm64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ninja
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.preset, 'arm64') && 'arm64' || 'x64' }}
      - name: Configure and build
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} --fresh -DGMNEW_VERSION=$GMNEW_VERSION
          cmake --build build/${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} --target gm-core
      - name: Chromium for the browser-scope check (arm64-windows)
        if: matrix.target == 'arm64-windows'
        shell: bash
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP/playwright-chromium")"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.65.0
          npx playwright-core install chromium
          echo "PLAYWRITER_BROWSER_PATH=$(node -p "require('$dir/node_modules/playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Check the browser path for the browser-scope check (arm64-windows)
        if: matrix.target == 'arm64-windows'
        shell: bash
        run: |
          printf 'PLAYWRITER_BROWSER_PATH=[%s]\n' "$PLAYWRITER_BROWSER_PATH"
          if [ -e "$PLAYWRITER_BROWSER_PATH" ]; then echo "browser path exists"; else echo "browser path missing"; fi
          if command -v cygpath >/dev/null; then cygpath -w "$PLAYWRITER_BROWSER_PATH"; fi
      - name: Host build stamp
        shell: bash
        run: |
          grep -E '^GMNEW_(COMMIT|VERSION):' "build/${{ matrix.preset }}/CMakeCache.txt"
          awk '/"command":/ { cmd = $0 } /"file":/ { f = $0; sub(/.*"file": *"/, "", f); sub(/".*/, "", f); if (f ~ /main\.cpp$/) { out = f; s = cmd; while (match(s, /-DGMNEW_BUILD_[A-Z_]+=[^ "\\]+/)) { out = out " " substr(s, RSTART, RLENGTH); s = substr(s, RSTART + RLENGTH) }; print out } cmd = "" }' "build/${{ matrix.preset }}/compile_commands.json"
      - name: Clean host rebuild
        shell: bash
        run: |
          cmake --build "build/${{ matrix.preset }}" --target gm gm-core --clean-first
          cmake --build "build/${{ matrix.preset }}" --target gm-tool
      - name: Worker binary versions
        shell: bash
        run: |
          dir="build/${{ matrix.preset }}/native/components/host"
          echo "git head: $(git rev-parse --short HEAD)"
          for name in gm.exe gm-core.exe; do
            p="$dir/$name"
            if [ ! -f "$p" ]; then echo "$name: absent"; continue; fi
            if v=$("$p" --version 2>/dev/null); then :; else v="version failed"; fi
            size=$(wc -c < "$p" | tr -d ' ')
            mtime=$(date -u -r "$p" +%Y-%m-%dT%H:%M:%S.000Z)
            echo "$name: $v size=$size mtime=$mtime"
          done
      - name: Windows cmd-only run_shell witness
        shell: bash
        run: build/${{ matrix.preset }}/native/components/tool/gm-tool.exe check "build/${{ matrix.preset }}/native/components/host/gm.exe" witness-windows-cmd
      - name: Package
        shell: bash
        run: build/${{ matrix.preset }}/native/components/tool/gm-tool.exe package --target ${{ matrix.target }} --build-dir build/${{ matrix.preset }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gmnew-${{ matrix.target }}
          path: dist/gmnew-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [build, build-windows]
    if: ${{ always() && github.repository == 'AnEntrypoint/gm' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish only a build newer than latest
        id: head
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          probe="$RUNNER_TEMP/latest-tag.sha"
          probe_err="$RUNNER_TEMP/latest-tag.err"
          read_latest_tag() {
            if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" --jq .object.sha > "$probe" 2> "$probe_err"; then return 0; fi
            if grep -q 'HTTP 404' "$probe_err"; then : > "$probe"; return 0; fi
            return 1
          }
          gh_retry read_latest_tag || { echo "cannot read the latest tag ref" >&2; cat "$probe_err" >&2; exit 1; }
          published=$(cat "$probe")
          order=new
          if [ -n "$published" ]; then
            order=$(gh_retry gh api "repos/$RELEASE_REPO/compare/$published...$GITHUB_SHA" --jq .status) || { echo "cannot read the release order"; exit 1; }
          fi
          case "$order" in
            ahead | identical | new) echo "current=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "latest is $published; $GITHUB_SHA is $order to it and is not published"
              ;;
          esac
      - name: Read the published release
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          read_present() {
            gh release view latest --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/present.txt" 2> "$RUNNER_TEMP/present.err" && return 0
            if grep -qiE 'HTTP 404|not found' "$RUNNER_TEMP/present.err"; then : > "$RUNNER_TEMP/present.txt"; return 0; fi
            return 1
          }
          gh_retry read_present || { echo "cannot list the release assets" >&2; cat "$RUNNER_TEMP/present.err" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous"
          if grep -qx manifest.json "$RUNNER_TEMP/present.txt"; then
            gh_retry gh release download latest --repo "$RELEASE_REPO" --pattern manifest.json --dir "$RUNNER_TEMP/previous" --clobber
          fi
      - uses: actions/checkout@v4
        if: steps.head.outputs.current == 'true'
      - name: Version
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          pattern: gmnew-*
          path: dist
          merge-multiple: true
      - name: Version the archive names
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          for file in dist/gmnew-*.tar.gz dist/gmnew-*.zip; do
            [ -e "$file" ] || continue
            name="${file#dist/gmnew-}"
            target="${name%.tar.gz}"
            ext=tar.gz
            if [ "$target" = "$name" ]; then
              target="${name%.zip}"
              ext=zip
            fi
            mv "$file" "dist/gmnew-$GMNEW_VERSION-$target.$ext"
          done
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          name: gm-tool
          path: tool
      - name: Make gm-tool runnable
        if: steps.head.outputs.current == 'true'
        run: chmod +x tool/gm-tool
      - name: Manifest and checksums
        if: steps.head.outputs.current == 'true'
        run: tool/gm-tool release-manifest --dir dist --version "$GMNEW_VERSION" --commit "$GITHUB_SHA" --repo "$RELEASE_REPO" --previous "$RUNNER_TEMP/previous/manifest.json" --present "$RUNNER_TEMP/present.txt" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the versioned archives
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          notes="$RUNNER_TEMP/notes.md"
          printf 'Version: %s\nCommit: %s\nBuilt: %s\n' "$GMNEW_VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$notes"
          release_state="$RUNNER_TEMP/release.state"
          release_err="$RUNNER_TEMP/release.err"
          read_latest_release() {
            if gh release view latest --repo "$RELEASE_REPO" >/dev/null 2> "$release_err"; then echo exists > "$release_state"; return 0; fi
            if grep -qiE 'HTTP 404|not found' "$release_err"; then echo missing > "$release_state"; return 0; fi
            return 1
          }
          gh_retry read_latest_release || { echo "cannot read the latest release" >&2; cat "$release_err" >&2; exit 1; }
          if [ "$(cat "$release_state")" = exists ]; then
            gh_retry gh release upload latest dist/gmnew-"$GMNEW_VERSION"-* --repo "$RELEASE_REPO" --clobber
          else
            gh_retry gh release create latest dist/gmnew-"$GMNEW_VERSION"-* --repo "$RELEASE_REPO" --title "latest $GMNEW_VERSION" --notes-file "$notes" --latest --prerelease=false
          fi
      - name: Point latest at the new manifest
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          notes="$RUNNER_TEMP/notes.md"
          gh_retry gh release upload latest dist/manifest.json dist/SHA256SUMS --repo "$RELEASE_REPO" --clobber
          gh_retry gh release edit latest --repo "$RELEASE_REPO" --title "latest $GMNEW_VERSION" --notes-file "$notes" --latest --prerelease=false
      - name: Move latest tag
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          tag_probe="$RUNNER_TEMP/latest-tag.sha"
          tag_err="$RUNNER_TEMP/latest-tag.err"
          read_latest_tag() {
            if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" --jq .object.sha > "$tag_probe" 2> "$tag_err"; then return 0; fi
            if grep -q 'HTTP 404' "$tag_err"; then : > "$tag_probe"; return 0; fi
            return 1
          }
          gh_retry read_latest_tag || { echo "cannot read the latest tag ref" >&2; cat "$tag_err" >&2; exit 1; }
          if [ -s "$tag_probe" ]; then
            gh_retry gh api -X PATCH "repos/$RELEASE_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh_retry gh api -X POST "repos/$RELEASE_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
      - name: Prune old builds
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          gh release view latest --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' \
            | tool/gm-tool prune-release-assets --keep 3 \
            | while read -r name; do gh_retry gh release delete-asset latest "$name" --repo "$RELEASE_REPO" --yes || true; done

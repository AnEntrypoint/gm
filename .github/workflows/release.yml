name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_REPO: AnEntrypoint/gm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
            target: x64-linux
            ccache: true
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
            target: arm64-linux
            ccache: true
          - os: macos-latest
            preset: x64-macos-release
            target: x64-macos
            ccache: true
            extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-latest
            preset: arm64-macos-release
            target: arm64-macos
            ccache: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: hendrikmuhs/ccache-action@v1.2
        if: matrix.ccache
        with:
          key: ${{ matrix.preset }}
          create-symlink: true
      - name: Configure and build
        shell: bash
        env:
          CCACHE_ARGS: ${{ matrix.ccache && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} -DGMNEW_BUILD_TESTS=ON -DGMNEW_VERSION=$GMNEW_VERSION ${{ matrix.extra }} $CCACHE_ARGS
          cmake --build build/${{ matrix.preset }}
      - name: Test
        shell: bash
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
      - name: Package
        shell: bash
        run: node tools/package.mjs --target ${{ matrix.target }} --build-dir build/${{ matrix.preset }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gmnew-${{ matrix.target }}
          path: dist/gmnew-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Not published yet: Windows fails most of its test suites. It builds and tests on every push so the failures stay visible.
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: x64-windows-release
          - os: windows-11-arm
            preset: arm64-windows-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.preset, 'arm64') && 'arm64' || 'x64' }}
      - name: Configure and build
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} -DGMNEW_BUILD_TESTS=ON -DGMNEW_VERSION=$GMNEW_VERSION
          cmake --build build/${{ matrix.preset }}
      - name: Test
        shell: bash
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

  publish:
    needs: build
    if: github.repository == 'AnEntrypoint/gm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop unless this commit is main's head
        id: head
        run: |
          head=$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main is at $head; $GITHUB_SHA is superseded and is not published"
          fi
      - uses: actions/checkout@v4
        if: steps.head.outputs.current == 'true'
      - name: Version
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          pattern: gmnew-*
          path: dist
          merge-multiple: true
      - name: Move latest tag
        if: steps.head.outputs.current == 'true'
        run: |
          if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$RELEASE_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$RELEASE_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
      - name: Version the archive names
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          for file in dist/gmnew-*.tar.gz dist/gmnew-*.zip; do
            [ -e "$file" ] || continue
            name="${file#dist/gmnew-}"
            target="${name%.tar.gz}"
            ext=tar.gz
            if [ "$target" = "$name" ]; then
              target="${name%.zip}"
              ext=zip
            fi
            mv "$file" "dist/gmnew-$GMNEW_VERSION-$target.$ext"
          done
      - name: Manifest and checksums
        if: steps.head.outputs.current == 'true'
        run: node tools/release-manifest.mjs --dir dist --version "$GMNEW_VERSION" --commit "$GITHUB_SHA" --repo "$RELEASE_REPO"
      - name: Upload the versioned archives
        if: steps.head.outputs.current == 'true'
        run: |
          notes="$RUNNER_TEMP/notes.md"
          printf 'Version: %s\nCommit: %s\nBuilt: %s\n' "$GMNEW_VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$notes"
          if gh release view latest --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload latest dist/gmnew-"$GMNEW_VERSION"-* --repo "$RELEASE_REPO"
          else
            gh release create latest dist/gmnew-"$GMNEW_VERSION"-* --repo "$RELEASE_REPO" --title "latest $GMNEW_VERSION" --notes-file "$notes" --latest --prerelease=false
          fi
      - name: Point latest at the new manifest
        if: steps.head.outputs.current == 'true'
        run: |
          notes="$RUNNER_TEMP/notes.md"
          gh release upload latest dist/manifest.json dist/SHA256SUMS --repo "$RELEASE_REPO" --clobber
          gh release edit latest --repo "$RELEASE_REPO" --title "latest $GMNEW_VERSION" --notes-file "$notes" --latest --prerelease=false
      - name: Prune old builds
        if: steps.head.outputs.current == 'true'
        run: |
          gh release view latest --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' \
            | node tools/prune-release-assets.mjs --keep 3 \
            | while read -r name; do gh release delete-asset latest "$name" --repo "$RELEASE_REPO" --yes; done

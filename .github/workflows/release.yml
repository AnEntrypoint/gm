name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release after the builds; false runs the builds only"
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_REPO: AnEntrypoint/gm
  GMNEW_AUTO_UPDATE: "0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
            target: x64-linux
            ccache: true
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
            target: arm64-linux
            ccache: true
          - os: macos-latest
            preset: x64-macos-release
            target: x64-macos
            ccache: true
            extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-latest
            preset: arm64-macos-release
            target: arm64-macos
            ccache: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ninja
      - uses: hendrikmuhs/ccache-action@v1.2
        if: matrix.ccache
        with:
          key: ${{ matrix.preset }}
          create-symlink: true
      - name: Configure and build
        shell: bash
        env:
          CCACHE_ARGS: ${{ matrix.ccache && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} -DGMNEW_VERSION=$GMNEW_VERSION ${{ matrix.extra }} $CCACHE_ARGS
          cmake --build build/${{ matrix.preset }}
      - name: Test
        shell: bash
        run: node tools/check-build.mjs build/${{ matrix.preset }}
      - name: Replay witness
        if: matrix.target == 'x64-linux'
        shell: bash
        run: |
          npm ci --ignore-scripts
          node tools/witness-next-context-replay.mjs node
          node tools/witness-next-context-replay.mjs build/${{ matrix.preset }}/native/components/host/gm
      - name: Package
        shell: bash
        run: node tools/package.mjs --target ${{ matrix.target }} --build-dir build/${{ matrix.preset }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gmnew-${{ matrix.target }}
          path: dist/gmnew-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: x64-windows-release
            target: x64-windows
          - os: windows-11-arm
            preset: arm64-windows-release
            target: arm64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ninja
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.preset, 'arm64') && 'arm64' || 'x64' }}
      - name: Configure and build
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} --fresh -DGMNEW_VERSION=$GMNEW_VERSION
          cmake --build build/${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} --target gm-core
      - name: Test
        shell: bash
        run: node tools/check-build.mjs build/${{ matrix.preset }}
      - name: Host build stamp
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const lines = fs.readFileSync(process.argv[1], "utf8").split("\n"); for (const line of lines) if (/^GMNEW_(COMMIT|VERSION):/.test(line)) console.log(line);' "build/${{ matrix.preset }}/CMakeCache.txt"
          node -e 'const fs = require("fs"); const db = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const entry of db) { if (!entry.file.endsWith("main.cpp")) continue; const command = entry.command || entry.arguments.join(" "); console.log(entry.file + " " + (command.match(/-DGMNEW_BUILD_[A-Z_]+=[^ ]+/g) || []).join(" ")); }' "build/${{ matrix.preset }}/compile_commands.json"
      - name: Clean host rebuild
        shell: bash
        run: cmake --build "build/${{ matrix.preset }}" --target gm gm-core --clean-first
      - name: Worker binary versions
        shell: bash
        run: |
          dir="build/${{ matrix.preset }}/native/components/host"
          echo "git head: $(git rev-parse --short HEAD)"
          node -e 'const fs = require("fs"); const cp = require("child_process"); const dir = process.argv[1]; for (const name of ["gm.exe", "gm-core.exe"]) { const p = dir + "/" + name; if (!fs.existsSync(p)) { console.log(name + ": absent"); continue; } const s = fs.statSync(p); let v = ""; try { v = cp.execFileSync(p, ["--version"], { encoding: "utf8" }).trim(); } catch (e) { v = "version failed: " + e.message; } console.log(name + ": " + v + " size=" + s.size + " mtime=" + s.mtime.toISOString()); }' "$dir"
      - name: Windows cmd-only run_shell witness
        shell: bash
        continue-on-error: true
        run: node tools/witness-windows-cmd.mjs "build/${{ matrix.preset }}/native/components/host/gm.exe"
      - name: Package
        shell: bash
        run: node tools/package.mjs --target ${{ matrix.target }} --build-dir build/${{ matrix.preset }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gmnew-${{ matrix.target }}
          path: dist/gmnew-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [build, build-windows]
    if: ${{ always() && github.repository == 'AnEntrypoint/gm' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish only a build newer than latest
        id: head
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          probe="$RUNNER_TEMP/latest-tag.sha"
          probe_err="$RUNNER_TEMP/latest-tag.err"
          read_latest_tag() {
            if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" --jq .object.sha > "$probe" 2> "$probe_err"; then return 0; fi
            if grep -q 'HTTP 404' "$probe_err"; then : > "$probe"; return 0; fi
            return 1
          }
          gh_retry read_latest_tag || { echo "cannot read the latest tag ref" >&2; cat "$probe_err" >&2; exit 1; }
          published=$(cat "$probe")
          order=new
          if [ -n "$published" ]; then
            order=$(gh_retry gh api "repos/$RELEASE_REPO/compare/$published...$GITHUB_SHA" --jq .status) || { echo "cannot read the release order"; exit 1; }
          fi
          case "$order" in
            ahead | identical | new) echo "current=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "latest is $published; $GITHUB_SHA is $order to it and is not published"
              ;;
          esac
      - name: Read the published release
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          read_present() {
            gh release view latest --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/present.txt" 2> "$RUNNER_TEMP/present.err" && return 0
            if grep -qiE 'HTTP 404|not found' "$RUNNER_TEMP/present.err"; then : > "$RUNNER_TEMP/present.txt"; return 0; fi
            return 1
          }
          gh_retry read_present || { echo "cannot list the release assets" >&2; cat "$RUNNER_TEMP/present.err" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous"
          if grep -qx manifest.json "$RUNNER_TEMP/present.txt"; then
            gh_retry gh release download latest --repo "$RELEASE_REPO" --pattern manifest.json --dir "$RUNNER_TEMP/previous" --clobber
          fi
      - uses: actions/checkout@v4
        if: steps.head.outputs.current == 'true'
      - name: Version
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: echo "GMNEW_VERSION=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          pattern: gmnew-*
          path: dist
          merge-multiple: true
      - name: Version the archive names
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          for file in dist/gmnew-*.tar.gz dist/gmnew-*.zip; do
            [ -e "$file" ] || continue
            name="${file#dist/gmnew-}"
            target="${name%.tar.gz}"
            ext=tar.gz
            if [ "$target" = "$name" ]; then
              target="${name%.zip}"
              ext=zip
            fi
            mv "$file" "dist/gmnew-$GMNEW_VERSION-$target.$ext"
          done
      - name: Manifest and checksums
        if: steps.head.outputs.current == 'true'
        run: node tools/release-manifest.mjs --dir dist --version "$GMNEW_VERSION" --commit "$GITHUB_SHA" --repo "$RELEASE_REPO" --previous "$RUNNER_TEMP/previous/manifest.json" --present "$RUNNER_TEMP/present.txt" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the versioned archives
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          notes="$RUNNER_TEMP/notes.md"
          printf 'Version: %s\nCommit: %s\nBuilt: %s\n' "$GMNEW_VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$notes"
          release_state="$RUNNER_TEMP/release.state"
          release_err="$RUNNER_TEMP/release.err"
          read_latest_release() {
            if gh release view latest --repo "$RELEASE_REPO" >/dev/null 2> "$release_err"; then echo exists > "$release_state"; return 0; fi
            if grep -qiE 'HTTP 404|not found' "$release_err"; then echo missing > "$release_state"; return 0; fi
            return 1
          }
          gh_retry read_latest_release || { echo "cannot read the latest release" >&2; cat "$release_err" >&2; exit 1; }
          if [ "$(cat "$release_state")" = exists ]; then
            gh_retry gh release upload latest dist/gmnew-"$GMNEW_VERSION"-* --repo "$RELEASE_REPO" --clobber
          else
            gh_retry gh release create latest dist/gmnew-"$GMNEW_VERSION"-* --repo "$RELEASE_REPO" --title "latest $GMNEW_VERSION" --notes-file "$notes" --latest --prerelease=false
          fi
      - name: Point latest at the new manifest
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          notes="$RUNNER_TEMP/notes.md"
          gh_retry gh release upload latest dist/manifest.json dist/SHA256SUMS --repo "$RELEASE_REPO" --clobber
          gh_retry gh release edit latest --repo "$RELEASE_REPO" --title "latest $GMNEW_VERSION" --notes-file "$notes" --latest --prerelease=false
      - name: Move latest tag
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          tag_probe="$RUNNER_TEMP/latest-tag.sha"
          tag_err="$RUNNER_TEMP/latest-tag.err"
          read_latest_tag() {
            if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" --jq .object.sha > "$tag_probe" 2> "$tag_err"; then return 0; fi
            if grep -q 'HTTP 404' "$tag_err"; then : > "$tag_probe"; return 0; fi
            return 1
          }
          gh_retry read_latest_tag || { echo "cannot read the latest tag ref" >&2; cat "$tag_err" >&2; exit 1; }
          if [ -s "$tag_probe" ]; then
            gh_retry gh api -X PATCH "repos/$RELEASE_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh_retry gh api -X POST "repos/$RELEASE_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
      - name: Prune old builds
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          gh release view latest --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' \
            | node tools/prune-release-assets.mjs --keep 3 \
            | while read -r name; do gh_retry gh release delete-asset latest "$name" --repo "$RELEASE_REPO" --yes || true; done

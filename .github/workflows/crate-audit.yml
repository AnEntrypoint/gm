name: crate-audit

permissions:
  contents: read

# Split out of doc-drift, where this job rode every doc-drift trigger although it reads
# only rs-plugkit/Cargo.toml, agentplug/Cargo.toml, the root deny.toml and the binary
# license inventory. Measured over 24 h on main: 124 doc-drift runs, 32 commits touching
# rs-plugkit and 14 touching agentplug, so this filter keeps the audit on every change
# that can move a locked crate or a licensed binary and drops it from the rest.
on:
  push:
    branches: [main]
    paths:
      - rs-plugkit
      - rs-plugkit/**
      - agentplug
      - agentplug/**
      - agentplug-*
      - agentplug-*/
      - deny.toml
      - scripts/check-crate-licenses.mjs
      - scripts/check-binary-licenses.mjs
      - scripts/binary-license-inventory.json
      - .github/workflows/crate-audit.yml
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: gm-crate-audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git submodule update --init --depth 1 rs-plugkit agentplug agentplug-treesitter
      - id: cargo-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-tools-audit-0.22.2-deny-0.18.4-${{ runner.os }}-${{ runner.arch }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        with:
          tool: cargo-binstall
      - name: Install cargo-audit 0.22.2 from its release binary
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm cargo-audit@0.22.2
      - name: No vulnerable crate in rs-plugkit or agentplug Cargo.lock
        run: |
          cargo audit --file rs-plugkit/Cargo.lock
          cargo audit --file agentplug/Cargo.lock
      - name: Rust crate licenses match the deny.toml allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.cargo-tools.outputs.cache-hit }}" != "true" ]; then
            cargo binstall --no-confirm cargo-deny@0.18.4
          fi
          node scripts/check-crate-licenses.mjs
      - name: Every tracked binary or vendored font carries an allowlisted license
        run: node scripts/check-binary-licenses.mjs

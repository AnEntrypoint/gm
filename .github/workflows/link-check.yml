name: link-check

permissions:
  contents: read

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: gm-link-check
  cancel-in-progress: true

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Every external http(s) link in README, docs, site and skills answers
        run: node scripts/check-external-links.mjs

name: contracts

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - scripts/check-contracts.mjs
      - scripts/contracts/**
      - rs-plugkit
      - rs-plugkit/**
      - agentplug
      - agentplug/**
      - .github/workflows/contracts.yml
      - scripts/check-verb-body-contract.mjs
      - skills/gm/docs/verbs.md
      - gm-mcp/src/**
  pull_request:
    paths:
      - scripts/check-contracts.mjs
      - scripts/contracts/**
      - rs-plugkit
      - rs-plugkit/**
      - agentplug
      - agentplug/**
      - .github/workflows/contracts.yml
      - scripts/check-verb-body-contract.mjs
      - skills/gm/docs/verbs.md
      - gm-mcp/src/**

concurrency:
  group: gm-contracts-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  consumer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node scripts/check-contracts.mjs
      - run: node scripts/check-verb-body-contract.mjs

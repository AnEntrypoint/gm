name: npx-route


on:
  push:
    branches: [main]
    paths:
      - package.json
      - bin/**
      - scripts/check-npx-bin.mjs
      - .github/workflows/npx-route.yml
  pull_request:
    paths:
      - package.json
      - bin/**
      - scripts/check-npx-bin.mjs
      - .github/workflows/npx-route.yml
  workflow_dispatch: {}

concurrency:
  group: gm-npx-route
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Fail when npm cannot resolve a bin from package.json
        shell: bash
        run: node scripts/check-npx-bin.mjs
      - name: Run the real npx install spec (main only)
        shell: bash
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-npx-bin.mjs --live

name: process-leak

permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'rs-*', 'agentplug', 'agentplug-*', 'agentplug/**', 'gm-config', 'gm-mcp']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']

concurrency:
  group: gm-process-leak-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: node scripts/scan-process-leak-tells.mjs --diff=${{ github.event_name == 'push' && github.event.before || 'origin/main' }}

name: gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'skills/dream-rsi/gm-graph.json'
      - 'scripts/build-graph-page.mjs'
      - 'flatspace.config.mjs'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch: {}

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Aggregate site platforms data
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Build graph page from the graph source
        run: node scripts/build-graph-page.mjs

      - name: Fetch the gm-config submodule that holds the state machine graph
        run: git submodule update --init --depth 1 gm-config

      - name: Build flatspace site
        run: npx flatspace@1.0.20 build

      - name: Verify the graph page is in the build output
        run: test -f dist/graph/index.html

      - name: Copy docs API data into dist
        run: |
          mkdir -p dist/docs/api
          cp docs/api/*.json dist/docs/api/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

name: gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'flatspace.config.mjs'
  workflow_dispatch: {}

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aggregate site platforms data
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Build flatspace site
        run: npx flatspace@latest build

      - name: Fetch live release + npm download data
        run: node scripts/fetch-live-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy docs API data into dist
        run: |
          mkdir -p dist/docs/api
          cp docs/api/*.json dist/docs/api/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

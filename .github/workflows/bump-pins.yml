name: bump-pins

# Advances every submodule pin to the tip of its target's main and publishes the
# result to main (scripts/bump-pins.sh). Runs on every push to main, on each
# submodule release (repository_dispatch) and hourly as a backstop. The bump commit
# carries [skip ci], so its own push does not re-trigger this workflow.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [submodule-released]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: gm-bump-pins
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Commit identity for pin bumps
        run: |
          git config user.name "gm-pin-bot"
          git config user.email "pins@users.noreply.github.com"

      - name: Advance pins and publish to main
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: bash scripts/bump-pins.sh

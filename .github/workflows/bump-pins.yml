name: bump-pins


on:
  push:
    branches: [main]
  repository_dispatch:
    types: [submodule-released]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  # A newer run supersedes an older one: the script re-reads origin/main on every
  # attempt, so stale queued work only burns minutes. Measured before this change:
  # 874 of 1464 run-minutes over 34 h were cancelled runs, and a scheduled run used
  # to queue behind a running one instead of replacing it.
  group: gm-bump-pins
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  advance:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'pins: advance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Commit identity for pin bumps
        run: |
          git config user.name "lanmower"
          git config user.email "657315+lanmower@users.noreply.github.com"

      - name: Advance pins and publish to main
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: bash scripts/bump-pins.sh

name: bump-pins


on:
  push:
    branches: [main]
    paths-ignore:
      - 'agentplug'
      - 'agentplug-bert'
      - 'agentplug-libsql'
      - 'agentplug-treesitter'
      - 'agentplug-crux'
      - 'gm-config'
      - 'gm-mcp'
      - 'rs-codeinsight'
      - 'rs-plugkit'
      - 'rs-search'
  repository_dispatch:
    types: [submodule-released]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: gm-bump-pins
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Commit identity for pin bumps
        run: |
          git config user.name "gm-pin-bot"
          git config user.email "pins@users.noreply.github.com"

      - name: Wait for a burst of submodule pushes to settle
        if: github.event_name == 'push'
        run: sleep 300

      - name: Advance pins and publish to main
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: bash scripts/bump-pins.sh

name: bump-pins


on:
  push:
    branches: [main]
  repository_dispatch:
    types: [submodule-released]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  # A newer run supersedes an older one: the script re-reads origin/main on every
  # attempt, so stale queued work only burns minutes. The one exception is the run
  # this workflow's own push starts: its job is skipped by the guard below, and with
  # an unconditional cancel it cancelled the parent that had just published (run
  # 39732961687 logged `published 293dfcef on attempt 1` and was recorded cancelled
  # two seconds later).
  group: gm-bump-pins
  cancel-in-progress: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'pins: advance') }}"

permissions:
  contents: write

jobs:
  advance:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'pins: advance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Commit identity for pin bumps
        run: |
          git config user.name "lanmower"
          git config user.email "almagestfraternite@gmail.com"

      - name: Advance pins and publish to main
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: bash scripts/bump-pins.sh

name: house-clean


on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the releases that would be pruned and delete nothing'
        type: boolean
        default: false

concurrency:
  group: gm-house-clean
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep-config-sync-litter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node scripts/sweep-config-sync-litter.mjs --root .
  tree-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Fail when a built artifact or plugkit version pin is tracked
        shell: bash
        run: |
          set -euo pipefail
          stale=$(git ls-files -- '*.wasm' 'bin/plugkit*' 'gm-plugkit/plugkit*' 'bin/*.version' 'gm-plugkit/*.version')
          if [ -n "$stale" ]; then
            echo "::error::built or version-pinned artifacts are tracked in gm; they are published to the -bin repos, not committed:"
            echo "$stale"
            exit 1
          fi
          echo "[ok] no built artifacts or version pins tracked"

  prune-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repo:
          - plugkit-bin
          - agentplug-bin
          - agentplug-bert-bin
          - agentplug-crux-bin
          - agentplug-codeinsight-bin
          - agentplug-libsql-bin
          - agentplug-treesitter-bin
    steps:
      - name: Keep only the newest non-draft release of AnEntrypoint/${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          REPO: AnEntrypoint/${{ matrix.repo }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh repo view "$REPO" >/dev/null 2>&1; then
            echo "$REPO does not exist; nothing to prune"
            exit 0
          fi
          # Newest first; prereleases count, so an in-flight prerelease is never deleted.
          tags=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name')
          keep=$(echo "$tags" | sed -n 1p)
          if [ -z "$keep" ]; then
            echo "$REPO has no published release; nothing to prune"
            exit 0
          fi
          assets=$(gh api "repos/$REPO/releases/tags/$keep" --jq '.assets | length')
          if [ "$assets" = "0" ]; then
            echo "::error::newest release $keep of $REPO has no assets; refusing to prune anything"
            exit 1
          fi
          candidates=$(echo "$tags" | sed 1d)
          echo "$REPO keeps $keep; pruning:"
          echo "$candidates"
          for tag in $candidates; do
            if [ "${DRY_RUN:-}" = "true" ]; then
              echo "would delete $tag (dry_run)"
              continue
            fi
            echo "deleting $tag"
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
            echo "pruned $tag"
          done
          echo "kept $keep in $REPO"

name: arm-diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ninja
      - name: Configure and build asan
        shell: bash
        run: |
          cmake --preset asan
          cmake --build build/asan
      - name: Node dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Chromium for the browser-scope check (linux-arm64)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/playwright-chromium"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.65.0
          npx playwright-core install --with-deps chromium
          browser=$(node -p "require('$dir/node_modules/playwright-core').chromium.executablePath()")
          test -x "$browser" || { echo "browser path missing: $browser" >&2; exit 1; }
          echo "PLAYWRITER_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
          echo "PLAYWRITER_NO_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Check asan build (conformance, one run)
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:print_stacktrace=1:detect_leaks=0
        run: |
          node tools/check-build.mjs build/asan

  gdb-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ninja
      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Configure and build release
        shell: bash
        run: |
          cmake --preset arm64-linux-release
          cmake --build build/arm64-linux-release
      - name: Node dependencies for the gdb run
        shell: bash
        run: npm ci --ignore-scripts
      - name: Chromium for the browser-scope check (linux-arm64)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/playwright-chromium"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.65.0
          npx playwright-core install --with-deps chromium
          browser=$(node -p "require('$dir/node_modules/playwright-core').chromium.executablePath()")
          test -x "$browser" || { echo "browser path missing: $browser" >&2; exit 1; }
          echo "PLAYWRITER_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
          echo "PLAYWRITER_NO_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Run the conformance check under gdb and print a backtrace on a signal
        shell: bash
        run: |
          gdb -batch -nx -ex 'set follow-fork-mode child' -ex run -ex "thread apply all bt 40" --args node tools/check-build.mjs build/arm64-linux-release > gdb-check.log 2>&1 || true
          if grep -qE "received signal|SIG[A-Z]+, " gdb-check.log; then
            echo "signal in the conformance run:"
            grep -E "received signal|SIG[A-Z]+, |^#" gdb-check.log | head -80
            exit 1
          fi
          echo "conformance run exited without a signal under gdb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdb-logs
          path: gdb-*.log
          if-no-files-found: ignore

name: arm-diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm-diagnose-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  asan-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ninja
      - name: Configure and build asan
        shell: bash
        run: |
          cmake --preset asan
          cmake --build build/asan
      - name: Check asan build (conformance, one run)
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:print_stacktrace=1:detect_leaks=0
        run: |
          build/asan/native/components/tool/gm-tool check build/asan/native/components/host/gm \
            check-run-code-budget check-restart-jobs check-run-code-progress check-read-parity check-protocol-versions check-relay-reexec \
            check-witness-next-context-replay check-build-handover check-console parity-contract check-stop-fetch check-install-switch \
            check-restart-skill-read check-no-resource-client check-embedded-runtime check-skill-serve check-resources-subscribe check-startup-attempts \
            check-repeated-checks check-owner-identity check-cut-marker check-grep-state-scope check-job-bounds check-shell-stdin \
            check-cancel-wait check-early-run-code check-read-after-write check-spawn-sites check-lazy-browser check-browser-scope \
            check-rows check-fetch check-wiki check-git check-review check-code-ast \
            check-quickjs-baseline check-install-follows check-skill-reload check-cli-flags check-feed-reference

  gdb-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ninja
      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Configure and build release
        shell: bash
        run: |
          cmake --preset arm64-linux-release
          cmake --build build/arm64-linux-release
      - name: Run the conformance check under gdb and print a backtrace on a signal
        shell: bash
        run: |
          gdb -batch -nx -ex 'set follow-fork-mode child' -ex run -ex "thread apply all bt 40" --args build/arm64-linux-release/native/components/tool/gm-tool phase-b build/arm64-linux-release > gdb-check.log 2>&1 || true
          if grep -qE "received signal|SIG[A-Z]+, " gdb-check.log; then
            echo "signal in the conformance run:"
            grep -E "received signal|SIG[A-Z]+, |^#" gdb-check.log | head -80
            exit 1
          fi
          echo "conformance run exited without a signal under gdb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdb-logs
          path: gdb-*.log
          if-no-files-found: ignore
